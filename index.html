ca degli algoritmi\nsottostanti. Nel corso dei mesi successivi sono state implementate via via nuove features. I feedback\nraccolti dagli utenti sono positivi come processi e come user experience. Il lavoro di miglioramento\ncontinuo proseguirà nei prossimi mesi, affiancato da attività di marketing volta ad aumentare il numero\ndi download e la frequenza di acquisto. Al momento i numeri non sono ancora tali da evidenziare\ntrend comportamentali rilevanti.\n\nRicerca per Indirizzo di consegna: fin dal disegno della prima versione del sito la logica di\nnavigazione voleva portare l’utente ad avere una vista completa dell’offerta di una città. Questa\nscelta è figlia della volontà di trasmettere fin dal primo accesso un’idea di un posizionamento unico\ned esclusivo mostrando la totalità dell’offerta, anche perchè un utente, utilizzando il sito spesso per i\nregali, sceglie indirizzi di consegna diversi in base all’occasione. In fase iniziale questa decisione si è\nrivelata vincente, anche alla luce di un raggio di consegna che prevedeva una distanza massima dal\nnegozio di 12km, coprendo di fatto la stragrande maggioranza delle richieste.\nNel tempo da un lato l’offerta è cresciuta, con un maggior numero di negozi in tutte le principali aree\ndelle città servite, dall’altro le consegne a lungo raggio si sono rivelate antieconomiche e penalizzanti\nper il servizio per il rischio di ritardi a catena che naturalmente comportano, ragion per cui si è deciso\ndi restringere il raggio di consegna prima a 10km poi a 8km. Questo ha avuto come effetto collaterale\nl’esclusione di una serie di aree di consegna per alcuni negozi, esclusione di cui il cliente viene oggi\nmesso a conoscenza solo in fase di checkout, dopo aver dedicato tempo a scegliere il prodotto più\nadatto all’occasione. Per eliminare questo “effetto delusione” è in fase di sviluppo una funzionalità di\nfiltro in base all’indirizzo di consegna. L’utente, se vorrà, potrà filtrare negozi e prodotti per\nvisualizzare solo quelli che possono effettivamente raggiungere la destinazione desiderata. È\nun’implementazione estremamente invasiva per le logiche di navigazione del sito, ma che riteniamo\nnecessaria per assicurare una piacevole esperienza di navigazione. Sarà live nel corso del Q4.\n\nArea Corporate: il business di Cosaporto è sempre più focalizzato sul segmento aziende, per questo\nè in fase di sviluppo un’area del sito interamente dedicata a questa clientela. Sarà live nel corso del\nQ4.\n\n                                             Governance\nSocietà Benefit: Cosaporto è diventata società benefit, scelta che certifica una volta di più il forte\nimpegno nel sociale. In allegato il nostro manifesto ESG.\n\n                                                Team\nInserimenti nel team commerciale di figure junior e senior\n\nQuesta la fotografia del team al 30/09.\n\nCittà                     Stage                Apprendistato           TI          Totale complessivo\nMilano                                     1                       1           5                           7\nRoma                                       1                       1           7                           9\nTotale complessivo                         2                       2          12                          16"},{"label":"Q2 2023","text":"Executive Summary\n\nDopo la vertiginosa crescita del biennio 2020-2021, trainata dagli effetti della pandemia, tutto il\ncomparto delivery ha fatto registrare un fisiologico “rimbalzo” con cali di volumi e di fatturati; molti\nplayer, anche importanti e presenti in diverse nazioni, hanno addirittura deciso di interrompere il\nservizio o di abbandonare i paesi in cui non riuscivano ancora a intravedere una potenziale\nsostenibilità economica.\nÈ in questo contesto che va analizzata la performance di Cosaporto relativa al primo semestre del\n2023, che fa registrare dati in netta controtendenza: i ricavi sono aumentati del 35% rispetto al\nprimo semestre 2022, aumentano lo scontrino medio e il ricavo medio da consegna e il margine\noperativo passa da 8% a 15%.\nQuesti risultati sono stati ottenuti grazie a una politica focalizzata sulla sostenibilità del business nel\nlungo periodo, nei prossimi paragrafi una breve descrizione delle principali iniziative divise per area.\n\n                                                   IT\nApp: il principale progetto portato avanti lato IT è la realizzazione della prima App di Cosaporto.\nL’app è uno strumento fondamentale per una migliore esperienza utente e per un aumento dei\nparametri di retention. La complessità delle logiche di business hanno reso il progetto molto articolato\nma il risultato è davvero entusiasmante. L’app coniuga eleganza e semplicità d’uso e fin dalla prima\nversione è apparsa solida e affidabile. La prima release è stata pubblicata a metà giugno; il piano\ndi lavoro, come per ogni progetto di tale complessità, prevede una serie di aggiornamenti fino a fine\nagosto in cui saranno via via rilasciate anche le funzionalità non core. Il piano di comunicazione è\nstato articolato in due fasi: nel corso del periodo estivo il messaggio sarà veicolato tramite i canali\ngratuiti e senza post sui social, a partire da metà settembre la comunicazione sarà più massiccia e\ncomporterà campagne, advertising, coinvolgimento di influencers. Le motivazioni di questa scelta sono\nsostanzialmente due: da un lato nel primo periodo potrebbe emergere qualche piccolo\nmalfunzionamento, fisiologico per progetti di questa portata, da indirizzare nel corso del periodo\nestivo; dall’altro una campagna nel momento di maggior calo dell’anno rischia di essere poco efficace,\nda qui la scelta di accelerare dopo il 15 settembre, quando storicamente i volumi tendono a risalire.\n\n                                               COMMERCIALE\nDark Quality Store: anche nel secondo quarter prosegue il costante rafforzamento del Dark Store.\nSono entrati circa 30 nuovi brand, in contovendita, e la vetrina digitale è stata arricchita da nuovi\nnegozi virtuali, divisi per categoria, per consentire una maggior facilità di navigazione all’utente. il\nposizionamento, esclusivo e riconosciuto, consente sempre più facilmente di mettere in piedi iniziative\ndi monetization: set up fee, canoni mensili, iniziative stagionali, vendita di spazi sul sito sono investimenti\nsostenibili per i brand e che consentono a Cosaporto di rendere la linea di business autoconsistente\ned economicamente sostenibile, coprendo i costi di magazzino, stock e personale. parallelamente\nall’attività commerciale e di marketing c’è un costante improvement sui processi e la tecnologia, per\nsemplificare e ottimizzare la gestione dei magazzini. Il fatturato del dark store nella prima metà del\n2023 è aumentato del 16% rispetto allo stesso periodo dello scorso anno.\n\nCorporate: La linea di business dedicata alle aziende, Cosaporto4business, è sempre più centrale\nnella strategia di crescita di Cosaporto. Nel corso di questi mesi il team sta implementando l’offerta\ncon l’ingresso di negozi e fornitori di catering e con lo sviluppo di funzionalità dedicate ai clienti\ncorporate. Il numero delle aziende che scelgono Cosaporto è in crescita costante con il risultato di un\n\naumento del fatturato del 40% rispetto al 2022 e un aumento dello scontrino medio del 24%.\nL’attività di origination passa, oltre che dal constate lavoro di scouting del team, anche da tantissimi\neventi di networking a cui Cosaporto partecipa in qualità di invitato o di sponsor, tra i più importanti\ndi questi mesi citiamo Sios Start Up Italia, il primo hackaton di Unimarconi e Manager Italia,\nLegalcommunity week, Italian teach alliance e il convegno dei giovani imprenditori di Confindustria.\nUna menzione particolare per Packaging Premiere, l'evento annuale più importante sul mondo del\npackaging da regalo e da retail, che coinvolge le principali aziende italiane ed internazionali del\nsettore. Cosaporto si è occupata, per il terzo anno consecutivo del catering dell’area Lounge (dedicata\nagli espositori ed ai loro clienti VIP) con un'offerta all day, dalla colazione all'aperitivo, in\ncollaborazione con Panino Giusto e Pasticceria Martesana.\nIn più siamo intervenuti sul palco con uno speech sul tema del packaging nel mondo del delivery e\nabbiamo organizzato vari catering privati presso gli stand degli allestitori, per eventi paralleli\ndurante la fiera. L’iniziativa è stata un un grande successo al punto da avere già un accordo per\nripeterla il prossimo anno con l’aggiunta di un ulteriore servizio: il pack business lunch da vendere agli\noltre 500 allestitori durante i 3gg di fiera.\n\nWe Care Catering: We Care Catering è un grande progetto che vuole coniugare qualità e\nsostenibilità. Tutto il materiale di consumo dei nostri catering è interamente sostenibile, marchiato\nCosaporto – We Care Catering, realizzato insieme con Cartaria Italiana per unire ai migliori prodotti\ndegli ottimi materiali che rispettano l’ambiente e hanno anche l’obiettivo di sensibilizzare i fruitori su\nun tema così importante.\n\nConsumer: la novità principale lato offerta è la messa in campo della strategia di progressiva\ncancellazione dei ristoranti dall’offerta consumer per concentrarli nell’ambito Corporate e il\nconseguente aumento di negozi negli ambiti gifting e lifestyle. Altro aspetto strategico cruciale è la\ncrescente attenzione ad attività di monetization; set up fee, canoni mensili, monetizzazione di iniziative\ndi marketing come la presenza in home page o in newsletter sono solo alcuni esempi: il lavoro fatto in\nquesti anni sul posizionamento del marchio consente oggi di attivare una stream di revenues ad alto\nmargine e non transaction based, che nel lungo periodo sarà decisiva per la sostenibilità del business.\nFunzionali a questo obiettivo sono anche le tante attività di co-marketing e bundle con brand di alto\nlivello, come il kit pic nic realizzato insieme a Veuve Clicquot o la gestione del \"BAR NHERO\" presso\nspazio Kaleidoscope durante la Milano Design Week, un’attività sperimentale figlia del\nposizionamento di Cosaporto, che ha generato una fee di commissione, senza costi di gestione, di\n2.000 euro.\n\nCittà: su Londra stiamo collaborando da circa tre mesi con Mita Group, società di comunicazione\ngestita da due ragazzi italiani molto intraprendenti che stanno curando i profili social, il rapporto con\ni negozi e la partecipazione a fiere ed eventi. Le sensazioni di questi primi mesi sono molto positivi, i\nragazzi sono perfettamente allineati e stanno lavorando molto bene. Con i mesi estivi è ripartita Forte\ndei Marmi ed è stata inaugurata Santa Margherita Ligure. Forte dei Marmi ha conto economico\npositivo fin dallo scorso anno. Per Santa Margherita è una stagione di lancio che ha l’obiettivo di\ngettare le basi per essere profittevole entro il terzo anno; inoltre per la prima volta a Santa\nMargherita Cosaporto offre la possibilità di consegnare direttamente alle barche in rada, servizio\nesclusivo che ancora una volta aiuta a definire il posizionamento del brand.\n\n                                              MARKETING\nGrowth: il focus di questo trimestre è stato lavorare per la crescita. Una delle attività principali è\nstato lo scouting e il set up di collaborazioni con società di consulenza che apportano competenze di\nalto livello e decisive per il raggiungimento degli obiettivi di medio-lungo periodo, in particolare:\n     • Honor Consulting: curerà tutti gli aspetti legati a comunicazione, PR, grafica\n\n    •   The Client Group/Exelab: specializzati in CRM e retention, hanno già collaborato con noi in\n        fase di set up del CRM e adesso abbiamo lanciato un progetto di revamp di tutti i flussi di\n        marketing automation, UX/UI, nuove iniziative di crescita.\n    • Mirai Bay: società di marketing a forte trazione data driven che ci ha supportato nel\n        passaggio alla nuova piattaforma di Google Analytics (GA4) e da settembre fornirà supporto\n        in ambito SEO, SEM, digital advertising\nObiettivo di queste collaborazioni è duplice: da un lato impostare attività strategiche e tattiche che\nsupportino la crescita, dall’altro aiutare il team a maturare competenze parzialmente mancanti e\naiutare a definire i profili più adatti da ricercare in futuro.\n\nInfluencers Marketing: è un canale molto in voga che porta buoni risultati. Lo abbiamo battuto a\nmodo nostro in questi mesi, selezionando una serie di influencers di dimensioni piccole o medie, ma\nmolto in target. Gli investimenti per testare questo canale sono stati minimi perché i prodotti sono stati\nforniti dai partner e gli influencers hanno avuto piacere a pubblicizzare gratuitamente un servizio\ninteressante e facile da divulgare come Cosaporto. In più abbiamo deciso di testare gli effetti di un\ninfluencer molto noto, Brenda Lodigiani, che nella sua performance ne Il Milanese Imbruttito incarna\nperfettamente la donna in carriera, con bambini e vita sociale frenetica, profilo molto affine a una\ndelle nostre principali buyer personas. Abbiamo scelto lei anche perché conosce bene Cosaporto, ha\nun tono irriverente ed è estremamente professionale; la collaborazione è arrivata in un momento in\ncui la sua notorietà era in forte crescita grazie alla partecipazione ad importanti trasmissioni televisive.\nI risultati sono stati molto positivi: oltre 6000 like e oltre 150.000 persone raggiunte.\n\nComarketing: anche in questo trimestre tante iniziative, tra le principali citiamo: co marketing con\nPanino Giusto per l’iniziativa dedicata alle aziende (“il Catering Giusto”), la collaborazione con NIU,\nproduttore di scooter elettrici, il co-marketing con Hello Fresh, Moet, Limolane.\n\nCharity: da sempre le iniziative charity sono parte del DNA di Cosaporto; questo trimestre, tra le\nvarie, citiamo l’organizzazione del Galà in Rosa, iniziativa di Gomitolorosa Onlus a cui partecipiamo\nper il terzo anno consecutivo. L’evento si è tenuto l’8 marzo coinvolgendo oltre 140 ospiti distanti circa\n700 chilometri in un’unica tavola virtuale tinta di arancione, colore rappresentativo della lotta alla\nsclerosi multipla.\nPer l’occasione, 5 nostri Partner hanno creato un menù, che abbiamo consegnato contemporaneamente\nin 6 città italiane. I proventi dell’iniziativa sono stati devoluti per finanziare la lanaterapia dei pazienti\naffetti da questa patologia.\n\n                                           PROGETTI SPECIALI\n\nGrowth: abbiamo deciso di stanziare un budget significativo, circa 100k€, in un progetto volto ad\nanalizzare tutte le possibili iniziative di crescita. La scelta è ricaduta sul gruppo Exelab/The Client\ngroup, società che conoscono bene la nostra realtà avendo già lavorato in fase di integrazione del\nCRM. Specializzati in processi di CRM e progetti di integrazione hanno tutti gli elementi per aiutarci\nin uno screening complessivo dei processi già in atto e per mettere in piedi nuovi automatismi e\nfunzionalità volte alla crescita. Il progetto è partito a fine giugno e durerà circa 6 mesi.\n\nUnicredit Start Up Lab: Unicredit Start Up Lab è il programma di sviluppo e sostegno alle migliori\nstart up condotto da Unicredit. Da 700 start up candidate ne sono state scelte 40, 10 per categoria\nche parteciperanno al programma a partire da settembre. Cosaporto è stata selezionata tra le 10\nvincitrici nella categoria Digital. Il programma prevede una serie eventi di networking, attività di\nmentoring, connessione con altre aziende con cui fare sinergia e visibilità, il tutto coordinato da\n\nUnicredit. È un riconoscimento importante da uno dei principali player del mercato finanziario italiano\ne internazionale, che assicura crescita e visibilità.\n\nSocietà Benefit: l’attenzione di Cosaporto verso la responsabilità sociale e la sostenibilità ambientale\nè da sempre nel nostro DNA ed è uno dei nostri Core Values. Questa attenzione è declinata in tutte\nle scelte di business, strategiche e operative, come la scelta di un fornitore all’ideazione di un progetto\ndi charity. Per questa ragione abbiamo deciso di avviare le pratiche per diventare Società Benefit.\nLe Società Benefit (SB) rappresentano un’evoluzione del concetto stesso di azienda: integrano nel\nproprio oggetto sociale, oltre agli obiettivi di profitto, lo scopo di avere un impatto positivo sulla\nsocietà e sulla biosfera. Successivamente attiveremo il processo per diventare BCorp, una\ncertificazione sfidante e ambiziosa, che verificherà la bontà di tutte le azioni che abbiamo e che\nvorremmo attuare:\n     - attenzione alla scelta di provider green per le consegne\n     - packaging sostenibile\n     - progetti di charity\n     - scelta di fornitori attenti alle tematiche sociali ed ambientali\nPer Cosaporto è importante questo passaggio segna ancora una volta la differenzia rispetto agli altri\nplayer di mercato, e ci avvicina ancora di più al nostro target di partner e clienti.\n\n                                             OPERATIONS\n\nCosto per delivery: le attività in questo ambito sono volte ad ottimizzare il costo medio di consegna\nche negli ultimi 12 mesi, complice i rincari diffusi del mercato, ha subito un aumento generalizzato. Su\nquest’area c’è un costante lavoro di scounting e onboarding di nuovi partner logistici e di fine tuning\nper automatizzare e snellire le attività della control room.\n\n                                                  TEAM\n\nDi seguito la fotografia del team al 30/6.\n\n     Sede             Apprendistato            Stage                 TI                Totale\nMilano                     2                     2                   3                   7\nRoma                       4                     2                   7                  14\nTotale                     6                     4                   10                 20\n                                                   KPI\nL’analisi dei principali indicatori di business conferma quanto detto in apertura. Le azioni messe in\ncampo sono volte a generare ricavi quanto più possibile costanti e non transaction based, significativo\nin questo senso vedere come, a fronte di un volume di transazioni tutto sommato invariato, il fatturato\nsia aumentato del 36% e il rapporto tra fatturato e transato dal 53% al 75%.\nAumenta lo scontrino medio del 13%, grazie alla crescita del segmento corporate sia in termini\npercentuali (dal 19% al 33% del totale transato) che in termini di scontrino medio (+24%).\nAnche la performance sulla consegna è migliorativa: l’introduzione di fasce di consegna maggiori di\n1h consente di valorizzare opportunamente il servizio di consegna in fascia stretta. Circa la metà dei\nclienti sceglie una fascia più larga e nonostante questo il ricavo medio per consegna è aumentato\ndel 24%.\nGli sconti aumentano dal 2,34% al 2,59%, ma l’effetto è dovuto essenzialmente alle gift card\nemesse per il crowdfunding, che pesano circa il 40% del totale.\n\nPer quanto riguarda la linea di business dedicata alle consegne richieste dai negozi (DAAS – Delivery\nAs A Service) c’è invece una lieve diminuzione del prezzo unitario dovuta essenzialmente al largo\nutilizzo delle fasce larghe. Anche questo è un indicatore importante perché porta alla conclusione che\nin precedenza stressavamo eccessivamente la flotta di delivery per fornire un livello di servizio anche\neccessivo rispetto all’aspettativa del cliente.\nTutte le iniziative su esposte concorrono ad un aumento del margine operativo dall’8% al 15%.\n\n   •   Transato: -7%\n   •   Fatturato: +36%\n   •   Scontrino Medio: +13%\n   •   Ricavo medio da consegna: +24%\n   •   % Sconti: 11%\n   •   Ricavi medio da consegna DAAS: -10%\n   •   Fatturato/Transato: +42%\n   •   Gross Margin: +85%"},{"label":"Q1 2023","text":"Executive Summary\n\nIn un contesto di relativa contrazione del mercato consumer, nel primo trimestre del 2023 Cosaporto\nha lavorato sulla sostenibilità del modello, migliorando tutti i principali indicatori di business e\nconsolidando linee di ricavo aggiuntive rispetto al Marketplace.\nContestualmente l’inizio del nuovo anno ha visto la partenza di una serie di iniziative destinate a\nportare frutti nel medio-lungo periodo.\n\nUna delle principali è un parziale reshaping dell’offerta: il periodo Covid, come sappiamo, ha\nfortemente influenzato il comportamento dei consumatori, e anche delle aziende; molti ristoranti di\nalto livello hanno scelto Cosaporto come piattaforma di delivery di riferimento, spinti da un\nposizionamento molto netto, definito e unico sul mercato. La fine della contingenza pandemica ha poi\nportato da un lato i ristoratori a focalizzarsi sul servizio in sala, dall’altro i clienti a cercare meno quel\ntipo di esperienza in casa. Alla luce di queste considerazioni, e per mantenere una connotazione unica\ne ben riconoscibile, Cosaporto ha scelto di focalizzare l’offerta sulle due aree in cui si sta\naffermando in maniera netta: il gifting e i servizi per la clientela Corporate.\n\nDi seguito un’analisi sintetica della performance del primo trimestre e un breve excursus sui principali\nprogetti.\n\n                                            COMMERCIALE\nCosaporto4Business, il segmento di offerta dedicato alle aziende, è un cantiere sempre aperto e\nricco di iniziative. A febbraio è stata annunciata la partnership con Panino Giusto, storico marchio\ndella gastronomia milanese, che ha scelto Cosaporto come partner per aggredire il mercato business\ncon una proposta catering innovativa e molto apprezzata.\nParallelamente prosegue l’implementazione di soluzioni a scaffale e implementazioni tecnologiche,\nper permettere ai clienti di gestire in autonomia i propri ordini, senza che sia necessario il supporto\ndei nostri account, che possono così dedicarsi ad attività di origination o a progetti speciali.\n\nMarketplace: Il team lavora stabilmente per portare a bordo nuovi negozi partner (tra i più importanti\ndel trimestre Niko Romito, chef 3 stelle Michelin, presente a Milano con la sua offerta di dolci e\ncolazioni) e per rinnovare i contratti con aumento di fee e introduzione di canoni/minimo garantito.\n\nDark Store: nuovi e importanti brand sono presenti nei magazzini di Milano, Roma, Torino, Bologna;\ntra gli altri citiamo Lavoratti, progetto di alta cioccolateria di Fabio Fazio che ha scelto Cosaporto\ncome unico canale per la commercializzazione di un uovo di Pasqua realizzato con Carlo Cracco.\nL’offerta del Dark Store si arricchisce mese dopo mese; questa linea di business contribuisce con un\nfatturato e un margine maggiore rispetto al Marketplace e assicura anche una baseline di ricavi\nindipendenti dal flusso di transazioni; i brand infatti pagano una fee mensile, indipendente dai volumi,\nper essere presente nei magazzini e sul sito.\n\nNuovi progetti: nel corso della Design week Cosaporto gestirà, con la collaborazione di Nhero Milano,\nun temporary bar, ottima occasione per acquisire nuovi clienti.\n\nMonetization: azioni continue in corso per incrementare il fatturato al netto del marketplace. Tra i\npartner con cui c’è maggior interazione citiamo Moet & Chandon, Matì Gourmet e Fridas.\n\nCharity: tra le iniziative svolte in questo trimestre citiamo CADMI, in occasione della giornata\ninternazionale della donna, e Istituto Pasteur e Associazione CAF Onlus in occasione della Pasqua.\n\n                                                MARKETING\nInfluencers marketing: nel corso del primo trimestre è stata testata la collaborazione con una serie\ndi influencers di diverso livello di notorietà, per valutare l’impatto in termini di nuovi clienti. Oltre 30\ninfluencers hanno pubblicato contenuti dedicati a Cosaporto ed è in corso un’analisi volta a definire i\nprossimi passi. Contestualmente è stata lanciata una gara tra diverse agenzie per definire le\ncondizioni migliori per impostare le comunicazioni dei prossimi mesi. La principale iniziativa in\nquest’ambito è stata la partnership con Brenda Lodigiani, attrice e influencer reduce dal successo di\nLOL3, e nuova brand ambassador di Cosaporto. Con Brenda Lodigiani, Cosaporto si lega ad un nome\ne un volto riconoscibile, amato dal pubblico e perfettamente in linea con il target di clientela.\n\nDigital Marketing: a fine marzo è stata conclusa l’attività SEO iniziata un anno fa con un consulente\nesterno e le competenze sono state internalizzate, per garantire un presidio costante sull’area.\nParallelamente è partito un progetto di programmatic advertising su piattaforma Criteo per aumentare\nl’engagement della customer base. Lato Retention, il fine tuning costante sui flussi di comunicazione\nb2b e b2c sta comportando un miglioramento delle perfomance. Infine è partita una nuova linea di\ncontenuti, “Parola di Quality Partner”, che promuove Cosaporto attraverso i nostri partner che\ndiventano dei veri e proprio “trusted advisors” nel presentare il servizio ai propri clienti.\n\n                                                   IT\nAPP: Il principale progetto in corso è la realizzazione della prima APP dedicata ai clienti di\nCosaporto. Dopo un’attenta fase di scouting è stato scelto Beliven come partner tecnologico, che sta\nlavorando insieme ai team IT e Marketing per realizzare il prodotto. La prima versione dell’app sarà\nnegli store a maggio. Obiettivo del progetto è aumentare la retention con uno strumento semplice,\nintuitivo e sempre “a portata di dito” per l’utente. Una volta realizzata l’app si potranno sfruttare le\nnotifiche push come efficace strumento di comunicazione.\n\n                                              OPERATIONS\nUna delle chiavi di volta per il funzionamento del modello è il costo connesso alla gestione del delivery.\nIn questo senso le azioni in corso in questi mesi sono indirizzate lungo tre direttrici:\n     • Diminuire il costo medio di consegna\n     • Diminuire l’effort del team di Control Room per consentire di gestire un numero di consegne\n        sempre maggiori a parità di staff\n     • Diminuire il gap tra ricavo medio da consegna e costo medio di consegna\n\nCosto medio di consegna: la forza lavoro dedicata alle consegne è completamente in outsourcing e\nsi divide in provider specializzati nel last mile delivery e personale temporaneo gestito direttamente\nda Cosaporto. Il lavoro di scouting di nuovi partner è continuo: nei primi mesi del 2023 sono entrati 2\nnuovi partner di delivery, uno a Roma e uno a Firenze, e un terzo entrerà da fine aprile a Milano;\nparallelamente con i partner consolidati è in fase di ridefinizione il contratto in essere. Anche per\nquanto riguarda le risorse gestite direttamente sono state implementate semplificazioni sulla\npiattaforma per semplificare l’attività. Inoltre è stata introdotta per i clienti la possibilità di scegliere\nfasce di consegna più larghe di 1h, a fronte di uno sconto. Questa scelta, già molto apprezzata,\nconsente una maggiore ottimizzazione della flotta e di conseguenza un risparmio sui costi.\n\nCosto di gestione: le attività di continuous improvement sui processi e sulla piattaforma tecnologica\nconsentono una costante diminuzione del costo necessario alla gestione delle attività di delivery.\n\nGap tra ricavo e costo di consegna: Lato prezzo è in atto un continuo fine tuning sia per i servizi di\nconsegna del Marketplace che per il servizio di Delivery as a Service, la capacità di attenuare questo\ngap è una delle sfide decisive per la sostenibilità. Sono state drasticamente diminuite le consegne\ngratuite e a maggio partirà una campagna di marketing volta a sottolineare il valore del servizio di\nconsegna e la differenza rispetto al percepito dai clienti che non conoscono il servizio, che\nnaturalmente tendono ad associarlo ai più comuni food delivery.\n\n                                              PASQUA\nI dati del Q1 non comprendono la maggior parte delle vendite di Pasqua, concentratesi nella prima\nsettimana di aprile, ma di seguito riportiamo ugualmente un commento.\n\nRispetto al 2022 c’è stata una contrazione di circa il 20% degli ordini, controbilanciata da un aumento\ndel 23% dello scontrino medio, effetti che combinati portano un volume di transato sostanzialmente in\nlinea. Le consegne gratuite sono state dimezzate e il costo unitario di consegna è diminuito di circa il\n25%, a dimostrazione degli effetti delle azioni in campo e del fatto che il modello, all’aumentare dei\nvolumi, performa meglio. Anche le consegne DAAS sono aumentate del 25%.\n\nParticolarmente interessante la performance del Dark Store: nella settimana di Pasqua gli ordini partiti\ndal Dark Store sono stati circa il 51% del totale, a fronte di un 41% dello scorso anno; il volume di\ntransato è passato dal 45% a quasi il 60%. Questi risultati da un lato premiano il lavoro di\nassortimento portato avanti in questi mesi, dall’altro garantiscono un maggior margine e\nun’ottimizzazione dei costi operativi.\n\n                                                 TEAM\nDi seguito la fotografia del team al 31/3.\n     Sede            Apprendistato            Stage                 TI               Totale\nMilano                    2                     2                    3                  7\nRoma                      4                     2                    8                 14\nTotale                    6                     4                   11                 21\n\n                                                     KPI\nDa mesi il mercato consumer sta registrando una contrazione significativa, effetto della congiuntura\nmacroeconomica, che nel nostro business si traduce in una riduzione degli ordini e del volume di\ntransato (-7%). Tuttavia gli sforzi fatti in questi mesi, volti a consolidare il posizionamento e a creare\nnuove linee di ricavo indipendenti dal marketplace, controbilanciano questo fenomeno facendo\nriscontrare non solo un aumento del fatturato di quasi il 50% rispetto allo scorso anno, ma anche un\nmiglioramento dei principali indicatori della solidità del modello.\n\nÈ aumentato lo scontrino medio, grazie all’effetto virtuoso del segmento Corporate, che pesa circa il\n25% del transato, il prezzo medio che il cliente paga per una consegna e sono diminuiti gli sconti che\nCosaporto eroga ai propri clienti, sebbene in questo valore sono comprese anche le gift card erogate\na seguito della campagna di crowdfunding.\nMolto positiva la performance del DQS (Dark Quality Store), la cui incidenza sul transato passa dal\n10% del 2022 al 17% del 2023, con un impatto positivo sul fatturato e sul margine.\n\nAnche la linea di business dedicata al DAAS registra un aumento del ricavo medio di circa il 25% e\nun incremento di fatturato in termini assoluti del 7%.\n\nTutto questo contribuisce ad aumentare la percentuale di fatturato su transato e contribuisce a rendere\nil modello di business più solido.\n\n   •   Transato: -7%\n   •   Fatturato: +46%\n   •   Scontrino Medio: +7%\n   •   Ricavo medio da consegna: +34%\n   •   % Sconti: -10%\n   •   Ricavi medio da consegna DAAS: +11%\n   •   Fatturato/Transato: +60%\n\n                          KPI                  2022             2023           Delta\n             Fatturato (k€)                        222 €            325 €           46%\n             Transato (k€)                         525 €            488 €            -7%\n             Scontrino Medio                      50,11 €          53,63 €            7%\n             Ricavo da consegna                    4,50 €           6,01 €          34%\n             % Sconti                              2,77%            2,50%          -10%\n             Ricavi da consegna DAAS              10,95 €          12,14 €          11%\n             Fatturato/Transato                      42%              67%           60%\n\n                                    Annual Report – Dicembre 2022\n\n                                          Executive Summary\n\nIl 2022 è stato un anno di conferma e crescita per Cosaporto: in un contesto in cui tutti i servizi di\ndelivery registravano perdite significative rispetto al biennio precedente, Cosaporto non ha solo ha\nincrementato sensibilmente il fatturato, ma anche migliorato tutti i principali indicatori di business e\nconsolidato linee di ricavo che danno maggior consistenza al modello perché non più basato\nesclusivamente sulla percentuale da marketplace.\nContestualmente il team si è arricchito di nuove energie e competenze ed è stato portato a termine\nun aumento di capitale che sarà decisivo per lo sviluppo futuro.\nNell’ambito di questo report di fine anno presenteremo brevemente le principali iniziative realizzate\nnel corso del 2022, divise per area, per poi entrare nel merito dei numeri e degli obiettivi raggiunti.\n\n                                               Società\nCosaporto ha chiuso l’aumento di capitale più importante della sua storia, per un totale di 5M€,\nsupportato in parte da una campagna di crowdfunding tra le più significative realizzate su\nMamacrowd.\nL’aumento di capitale è stato realizzato grazie all’investimento di molteplici soggetti:\n    • I vecchi soci, che hanno continuato a credere nel progetto\n    • Nuovi e importanti business angels, imprenditori e c-level di multinazionali\n    • 230 investitori retail che hanno partecipato alla campagna di crowdfunding su Mamacrowd\n    • L’ingresso di un nuovo fondo (Azimut Libera impresa)\n    • Il follow on di Lazio Innova, che con questo ulteriore investimento raggiunge il massimo valore\n       disponibile da statuto per una start up. Una nota: Cosaporto è la prima start up in cui Lazio\n       Innova investe la totalità del budget disponibile\n\nInoltre, è stato erogato un finanziamento a tasso agevolato da parte di BNP Paribas che, facendo\nseguito a quanto già realizzato in altri paesi, ha messo dato vita anche in Italia a una linea di business\ndedicata alle start up; Cosaporto è la prima azienda ad entrare a far parte di questa operazione\nper il territorio italiano.\n\n                                                   IT\nNel corso del 2022 sono state realizzate tante funzionalità che impattano tutto il flusso di processo di\nCosaporto, di seguito un focus su alcune delle iniziative più significative:\n   • CRM: tra la fine del 2021 e il primo trimestre del 2022 è stato implementato il CRM su\n       piattaforma Hubspot, uno dei principali provider a livello mondiale. Il CRM è uno strumento di\n       lavoro indispensabile che consente di ottimizzare una serie di processi chiave, di seguito i\n       principali:\n           o La comunicazione inbound/outbound con i clienti, centralizzata su un’unica piattaforma,\n               indipendentemente dal canale di comunicazione (mail, chat, whatsapp)\n           o Le campagne di marketing via email, realizzabili su cluster di clienti con comportamento\n               di acquisto omogenei, o via social network\n           o I flussi di comunicazione automatizzati in funzione di determinati trigger\n           o Le mail transazionali\n           o L’assegnazione ela gestione dei task tra i membri dei diversi team\n           o La reportistica\n\n    Oggi il CRM è uno strumento fondamentale per ottimizzare il lavoro del team e fluidificare i\n    principali processi di comunicazione\n•   Nuovo sito: facendo seguito all’attività di rebranding iniziata nel 2021 e a una serie di analisi\n    di UX/UI, a giugno 2022 è andata live la nuova versione del sito, con una grafica rivista e\n    una navigabilità migliore. Un sito più elegante e un’esperienza utente ottimizzata, per esaltare\n    al meglio i tratti distintivi della proposta di Cosaporto.\n•   Ricerca prodotti: su Cosaporto sono ormai disponibili oltre 20.000 item, per garantire agli\n    utenti una soddisfacente esperienza di navigazione è stato implementato uno strumento di\n    ricerca estremamente avanzato su piattaforma Algolia, leader mondiale in questo tipo di\n    servizi. Algolia riconosce le richieste degli utenti e favorisce una serie di risultati in maniera\n    intelligente. Obiettivo del progetto è consentire agli utenti di trovare immediatamente il\n    prodotto che cercano, a partire da un nome, da un negozio, da una categoria merceologica,\n    evitando la spiacevole sensazione di perdersi per l’eccessiva offerta.\n•   Fatturazione a fine mese: tra le molte iniziative dedicate alla clientela Corporate, una delle\n    più apprezzate è quella che consente alle aziende con cui c’è una relazione consolidata di\n    ordinare e pagare a fine mese a fronte di un’unica fattura riepilogativa, evitando così di\n    gestire diversi pagamenti e diverse fatture.\n•   Cosaporto Gifting Platform: Cosaporto Gifting Platform è una piattaforma che semplifica\n    tutto il processo di regalistica aziendale, massimizzando la soddisfazione di aziende e\n    destinatari. L’azienda seleziona una serie di possibili regali, ciascun dipendente può accedere\n    alla piattaforma e scegliere il regalo che preferisce (senza vederne il prezzo, naturalmente)\n    e decidere giorno, ora e indirizzo di consegna. Questa soluzione consente di snellire le attività\n    in carico alle aziende e permette ai dipendenti di ricevere un regalo gradito, anche se vivono\n    o trascorrono le vacanze natalizie lontano dalla sede di lavoro.\n\n                                           Commerciale\n•   Corporate: nel corso del 2022 il lavoro sulla clientela corporate è stato incrementato\n    sensibilmente, con l’assunzione di account dedicati, la realizzazione di feature a sistema e\n    l’implementazione di un’offerta più ricca. Il risultato è stato un incremento dello scontrino medio\n    complessivo da 60,3€ a 67,1€ (+11%). Nell’ambito delle iniziative Cosaporto4Business oggi\n    i clienti possono richiedere in autonomia preventivi per eventi e regalistica attraverso un form\n    guidato, per essere poi ricontattati da un account che si occuperà di portare il deal alla\n    conclusione.\n•   Dark Quality Store: La linea di business dedicata al DQS è cresciuta di oltre il 60% rispetto\n    allo scorso anno, garantendo maggior fatturato e maggiori margini. I brand presenti nel Dark\n    Store pagano un canone di locazione e forniscono i prodotti in conto vendita, per avere\n    l’opportunità di essere presenti in città dove non dispongono di un punto vendita fisico e sulla\n    vetrina di Cosaporto. Questo assicura una baseline di ricavi garantita e minimizza il rischio di\n    invenduto. Per massimizzare i volumi sono stati presi in affitto spazi più ampi ad uso\n    magazzino, i cui costi sono stati coperti dai canoni.\n•   CUC – Chiedici una consegna: il servizio B2B dedicato ai negozi ha avuto una crescita del\n    50% rispetto al 2021 in termini di volumi, a dimostrazione di quanto il servizio sia sempre più\n    richiesto dai punti vendita retail e dai clienti finali. Il servizio è a disposizione di tutti i negozi\n    partner ed è stato venduto anche ad una serie di brand e negozi non in piattaforma, che\n    accedono al servizio versando un canone mensile, in aggiunta al costo della singola consegna.\n    Nel corso del 2022 il pricing del servizio, inizialmente limitato anche per ragioni commerciali,\n    ha avuto un aumento mediamente del 45%. Complessivamente questa linea di business, che\n    gira a margine positivo, ha portato un incremento del fatturato più che doppio% rispetto\n    all’anno precedente (+116%).\n\n•   Marketplace: le attività commerciali in quest’ambito sono continue: i city manager sono\n    costantemente alla ricerca di nuovi negozi partner in linea con la proposta di Cosaporto e\n    lavorano a stretto contatto per svilupparne l’offerta con nuovi prodotti e iniziative. In parallelo\n    procede il lavoro sui partner già in portafoglio, portando all’uscita quelli con performance non\n    adeguata e aumentando progressivamente le fee in fase di rinnovo. In aggiunta, sempre più\n    partner hanno delle clausole contrattuali che garantiscono a Cosaporto un incremento di ricavo,\n    in dettaglio:\n        o Minimo garantito mensile\n        o Canone mensile\n        o Penali a fronte di disservizi\n    Tutte queste iniziative hanno portato un incremento della percentuale fatturato/transato del\n    Marketplace dal 33% al 53%\n•   Cosaporto Christmas Boutique: per il periodo natalizio (dal 5 dicembre al 10 gennaio) è\n    stato preso in affitto un temporary store a Corso Garibaldi a Milano. È stata la prima\n    esperienza di un punto vendita fisico gestito interamente da Cosaporto. All’interno del negozio\n    sono stati messi in vendita una selezione dei prodotti natalizi disponibili su Cosaporto, con la\n    possibilità di comporre la propria box regalo e di avvalersi del servizio di personal shopper\n    per i regali di Natale. Tutti i brand i cui prodotti sono stati esposti e venduti in store hanno\n    versato un canone, fino alla totale copertura del costo di affitto del locale. La location è\n    stata utile per catturare l’attenzione dei passanti e far conoscere il servizio a nuovi clienti ed\n    è stata sede di una serie di eventi con la partecipazione di personaggi che hanno contribuito\n    alla diffusione della notizia, tra gli altri Carlo Cracco e Filippo La Mantia.\n•   Città:\n        o Forte dei Marmi: il secondo anno di attività su Forte dei Marmi è stato un successo.\n            Scontrino medio elevato e alto tasso di retention hanno reso Forte dei Marmi una best\n            practice: ad oggi è la prima città con il conto economico in positivo. Un modello da\n            replicare su altre località con caratteristiche paragonabili. Inoltre, tutte le consegne\n            sono state eseguite con mezzi green (bici, scooter elettrico, auto elettrica).\n        o Courmayeur: Courmayeur è l’ottava città di Cosaporto, attiva da dicembre, lanciata\n            sul modello di Forte dei Marmi con un’offerta composta da negozi locali e prodotti\n            disponibili in modalità Dark Store. Per essere presenti nel Dark Store di Courmayeur i\n            brand hanno sostenuto un canone che complessivamente ha coperto i costi fissi di\n            struttura della città.\n•   Monetization: le iniziative di Monetization si dividono in tre stream:\n        o iniziative volte a monetizzare il crescente traffico di utenti sul sito e di ordini, ad\n            esempio:\n                ▪ Pacchetti di visibilità per i negozi partner: presenza in Home page, newsletter\n                     e post social dedicati per periodi di tempo predefiniti\n                ▪ Presenza in sezioni del sito dedicate ad eventi/offerte\n                ▪ Sampling: distribuzione di campioni gratuito di prodotto insieme ad ordini\n                     Cosaporto\n                ▪ Newsletter dedicate a brand partner su un cluster di clienti in target.\n        o iniziative volte a incrementare la percentuale di fatturato/transato del marketplace,\n            ad esempio:\n                ▪ Fee di set up per nuovi negozi\n                ▪ Minimo garantito mensile\n                ▪ Canone mensile\n                ▪ Penali a fronte di disservizi\n\n           o Iniziative volte ad assicurare una baseline di ricavi al Dark Store fino a coprire i costi\n             di struttura, ad esempio:\n                  ▪ Fee di set up\n                  ▪ Canone mensile\n                  ▪ Merce in omaggio.\n\n                                             Marketing\nNel 2022 tutta la strategia di marketing è stata rivista nell’ottica di incrementare l’acquisizione di\nnuovi clienti e stimolando acquisti da parte dei clienti già in portafoglio, ottimizzando il budget,\npassaggio necessario per una crescita sostenibile.\n\nDi seguito una breve sintesi delle principali attività di marketing del 2022, divise per categoria:\n    • Digital Marketing\n            o Clusterizzazione dei clienti in base al loro comportamento di acquisto e set up di un\n               piano di retention volto a incrementare il numero di acquisti dei clienti in portafoglio\n            o Revisione di tutta la strategia SEO, SEM e ADS (performance, alberatura sito, nuova\n               strategia sulle keywords di ricerca)\n            o Attività di retargeting e Programmatic adv\n    • Partnership e co-marketing: la customer base dei negozi partner e in generale di tutti i\n       partner commerciali rappresenta un’opportunità di grandissimo valore per Cosaporto; la\n       crescita del brand passa anche da un’adeguata valorizzazione di questo asset. Le attività di\n       comunicazione e co-marketing sono state portate avanti con\n            o Tutti i negozi partner\n            o I principali fornitori, tra gli altri: Stuart, Trustpilot, Birò, Cake\n    • PR e comunicazione\n            o È stato siglato un accordo con una nuova agenzia creativa (150up) e realizzazione\n               nuovi shooting per foto e video promozionali\n            o È stato siglato un accordo con un nuovo ufficio stampa (Les Enderlin), che ha\n               contribuito ad una significativa presenza di Cosaporto sui principali organi di stampa\n               (per citarne alcuni; Corriere della sera, La Repubblica, il Sole 24 Ore, Milano\n               Finanza, Start Up Italia, Vogue, Elle, Gambero Rosso, Io Donna, AD, Wired,\n               Cosmopolitan, Marie Claire)\n            o Attività di Influencer marketing\n            o Partecipazione ad una serie di eventi in qualità di ospiti, ad esempio: Il Salone del\n               gusto di Torino, State of Privacy 22, Techchill all’università Bocconi, Specialty fine\n               food fair a Londra, Business school de Il Sole 24 Ore e corsi presso l’Unint –\n               Università degli Studi Internazionali di Roma\n    • Iniziative di marketing Out Of Home\n            o Sponsorizzazione di un tram storico nel centro di Milano nei mesi di novembre e\n               dicembre\n            o BTL, flyer e campagne di volantinaggio\n\n                                              Team e sedi\nNel 2022 il team si è arricchito di nuove e significative competenze in tutti gli ambiti.\nAl 31/12/22 il team conta 19 risorse assunte, così distribuite tra le sedi di Roma e Milano.\n\n        Sede           Apprendistato              Stage                   TI                   Totale\n\nMilano                          2                     0                     4                     6\nRoma                            4                     1                     8                    13\nTotale                          6                     1                    12                    19\n\nL’aumento delle persone e l’incremento dell’attività di Dark Store ha reso necessaria la ricerca di nuovi\nspazi, a Roma e Milano, sia come uffici che come magazzino.\n\n                                                 KPI\nL’effetto delle azioni descritte in precedenza ha comportato un incremento dei ricavi di oltre il 20%,\nanche a fronte di una contrazione del 14% del transato.\nA ulteriore conferma dello stato di salute del business, da sottolineare anche il miglioramento degli\nindicatori di seguito:\n    • Scontrino medio negozio: da 53,0€ a 60,2€ ➔ +14%\n    • Scontrino medio cliente: da 60,3€ a 67,1€ ➔ +11%\n    • Ricavo medio da consegna: da 4,1€ a 4,8€ ➔ +19%\n    • % Sconti: da 3,09% a 2,64% ➔ -15%"},{"label":"Settembre 2022","text":"Executive Summary\n\nIl terzo quarter del 2022 ha confermato l’ottimo trend di crescita dei mesi precedenti. Il confronto\nrispetto allo scorso anno va analizzato considerando che i mesi gennaio-marzo hanno fatto registrare\ncrescite molto rilevanti per tutti i servizi di delivery operanti nel segmento consumer, a causa delle\nrestrizioni dovute alla pandemia.\nA partire dal mese di aprile le performance 2022 di Cosaporto sono stabilmente migliori rispetto a\nquelle del 2021: il periodo aprile-settembre ha un fatturato superiore di circa il 65% rispetto allo\nstesso periodo dello scorso anno, perfettamente in linea con gli obiettivi di crescita.\nQuesti risultati assumono contorni ancor più positivi considerando chele spese di Marketing sono state\nmantenute molto basse durante tutto il quarter, per consentire di focalizzare gli investimenti su altre\naree e traguardare l’aumento di capitale senza incorrere in rischi di poca liquidità.\nMolto positiva, in particolare, la performance di Forte dei Marmi, che ha generato un GMV doppio\nrispetto al 2021, e del segmento Corporate che anche nei mesi estivi ha garantito ottimi fatturati e\nscontrini elevati.\n\n                                             Commerciale\n\nIl grande successo del Q3 è la performance di Forte dei Marmi dove è stato capitalizzato\nl’investimento dello scorso anno con un volume di transato doppio rispetto allo scorso anno e uno\nscontrino medio più alto di oltre il 50% e un margine economico positivo. Forte dei Marmi da un lato\nè un’ulteriore conferma di validazione del modello di business, dall’altro dimostra che la soluzione\n“temporary” nelle principali e più esclusive località di villeggiatura non solo funziona nel breve, ma è\nanche un ottimo canale di acquisizione clienti; alla luce di questa esperienza stiamo pianificando due\nnuovi temporary: uno invernale a Courmayeur e uno per l’estate 2023 a Santa Margherita e Portofino.\nNel corso del Q3 ci sono stati ingressi di partner importanti in tutte le città, tra i principali: Momo\nDesign, Fao Schwartz, Hasekura, Mantero e Vogue che ha realizzato una linea di prodotti (baci di\ndama e panettoni in vista del Natale) con pasticceria San Carlo, che avrà in Cosaporto l’unico canale\ndi vendita digitale. All’onboarding di nuovi partner si affianca un’attività continua di rinnovo dei\ncontratti in essere con aumento delle fee e introduzioni di canoni e minimi mensili che assicurano una\nbaseline di fatturato anche in caso di bassa performance del partner. Il prossimo trimestre vedrà\nl’ingresso di nuovi partner in particolare a Roma, Bologna e Londra.\nIl team è stato riorganizzato con la crescita di Francesca Corradi che, oltre a mantenere l’ownership\ndi Milano e Torino, diventa anche riferimento e coordinatrice dei City Manager.\nIl prossimo trimestre sarà naturalmente focalizzato sul Natale, con tante iniziative organizzate in\nautonomia o insieme ai partner principali. È attualmente in fase di studio di fattibilità l’opportunità di\n\naprire un negozio fisico nel periodo di Natale in una zona centrale di Milano, per acquisire nuovi\nclienti e vendere i prodotti del nostro Store.\n\n                                               Corporate\n\nUno dei dati più significativi del trimestre è la crescita del segmento corporate che è raddoppiata nei\nmesi di luglio e agosto del 2021. Questo da una chiave di lettura importante dell’”effetto Covid” per\nil nostro business. Se è vero, infatti, che le restrizioni pandemiche hanno contribuito alla crescita\nvertiginosa di Cosaporto (come di tutti i servizi di delivery orientati al segmento consumer) è anche\nvero che il segmento Corporate è stato enormemente penalizzato. La ripresa delle attività in presenza\ne degli eventi in ufficio ci sta dando l’opportunità non solo di aumentare il fatturato complessivo\nrispetto allo scorso anno, in un contesto in cui la maggior parte dei servizi di delivery dichiara perdita\ntra il 20 e il 30%, ma anche di costruire una pipeline che sarà fondamentale in vista della proposta\nnatalizia. A riprova di questo basti pensare che a luglio sono già stati venduti i primi 1.500 panettoni\nad aziende.\nNaturalmente a questo si affianca una continua attività IT, sia con iniziative di marketing automation,\nsia con l’industrializzazione di una serie di processi per migliorare l’esperienza utente e semplificare\nl’attività del team; due esempi: “Cosaporto 4 Party”, dedicata all’organizzazione di feste in casa e\n“Cosaporto 4 Business” che ottimizza le richieste delle aziende.\nDa settembre entrerà una nuova risorsa dedicata allo sviluppo del segmento Corporate.\n\n                                          Dark Quality Store\n\nSempre più sono i brand che scelgono di aderire alla modalità Dark Store, la maggior parte dei quali\nin modalità “conto vendita” e versando un canone per l’utilizzo dei magazzini. Nei primi 7 mesi del\n2022 il volume di transato di questa linea di business è aumentata di 6 volte rispetto allo scorso anno,\ncontribuendo alla sostenibilità economica con una marginalità più alta rispetto alla marketplace.\nPer alimentare la crescita di questa linea di business stiamo lavorando sugli spazi a disposizione: a\nRoma abbiamo preso un nuovo ufficio, adatto alle dimensioni attuali e future del team che ha anche\nle caratteristiche necessarie a fungere da magazzino temporaneo; a Milano nel corso del mese di\nsettembre sarà operativo un nuovo magazzino per consentire la gestione di una maggiore quantità di\nmerce.\n\n                                                   UX\n\nIn continuità con il lavoro degli ultimi mesi, iniziato con il rebranding e la realizzazione della nuova\nveste grafica, nel corso del Q3 è stata affinato tutto il front end per rendere il sito internet più\nelegante ed essenziale e per migliorare tutta l’esperienza di navigazione. Sono state ridisegnate tutte\nle pagine (homepage, schede negozio, schede prodotto), le icone e tutto il processo di acquisto. Il\nrestilyng mette ancora più in luce i punti di forza di Cosaporto, con aree dell’home page dedicate\nalle occasioni d’uso e alle categorie merceologiche.\nÈ stata portata in home page la funzionalità di ricerca in base alla data di consegna, ed è stata\nintrodotta un’area dedicata al giudizio dei nostri partner e dei nostri clienti, per guadagnare la fiducia\ndei clienti che arrivano sul sito per la prima volta. È stata introdotta inoltre un’area definita “Fuori\nMenu”, uno spazio che sarà utilizzato di volta in volta per i temi che vogliamo portare all’attenzione\ndegli utenti: dall’opportunità di partecipare alla campagna crowdfunding, a promozioni o offerte\nspecifiche fino alle iniziative di loyalty.\nAltra novità importantissima è l’implementazione di Algolia. Algolia è leader nel mercato dei motori\ndi ricerca interni al sito, utilizzato da moltissimi e-commerce al livello mondiale. Adesso è possibile\ncercare sul sito un prodotto o una tipologia (ad es “torta al cioccolato”) ed ottenere una serie di\n\nrisposte precise e affinabili tramite una serie di filtri fino a trovare il prodotto più adatto.\nL’implementazione di un motore di ricerca intelligente era fondamentale dal momento che sul sito sono\npresenti ormai circa 20k prodotti; l’integrazione è stato un progetto impegnativo ed oneroso, ma il\nrisultato porta l’usabilità del sito ad un livello superiore, consentendo a tutti i clienti di navigare in\nmaniera rapida verso i prodotti di maggior interesse. A metà agosto è andata live la prima versione\ndel motore di ricerca. Nel corso del Q4 il lavoro su Algolia continuerà con una serie di obiettivi:\n     • Fine tuning sulle logiche di ricerca\n     • Veicolare ai primi posti i prodotti a maggior valore per Cosaporto\n     • Analizzare i dati delle ricerche utenti per ottimizzare la proposta del sito e l’ordine dei prodotti\n         e dei partner.\n\n                                                 Marketing\n\nL’adozione del CRM su piattaforma Hubspot ha dato la possibilità di rivedere tutta la strategia di\ndigital marketing e focalizzare flussi di comunicazione su cluster delimitati in maniera molto precisa.\nNel corso del Q3 sono andati live tutti i flussi dedicati alle attività di retention, oggetto costante di\nanalisi e fine tuning, che sta già comportando una crescita dei tassi di riacquisto, area in cui riteniamo\ndi avere importanti spazi di crescita.\nSempre in ambito digital marketing, è stata incrementata l’attività SEM, Adwords e Meta Ads, ed è\nin corso di sviluppo una nuova strategia SEO, di concerto con un consulente esterno.\nInoltre è stato avviato il disegno di un Membership Program, che sostituirà l’attuale programma di\nloyalty, con l’obiettivo di valorizzare l’esperienza dei clienti più affezionati creando dei livelli di\nmembership e relativi benefici, che riteniamo essere più interessanti di un mero sconto per la nostra\nclientela.\nInfine è stata definita la strategia di marketing da adottare per la campagna di crowdfunding. Sono\nstati definiti una serie di target e per ciascuno azioni, canali di comunicazione, messaggi e tempistiche.\nLe azioni dei prossimi mesi, oltre a portare avanti i cantieri in corso, saranno incentrate sulla conclusione\ndella campagna di crowdfunding e sulle campagne per il Natale.\n\n                                                   Team\n\nIntroduzione di alcune nuove figure:\n    • BD con focus su segmento Corporate\n    • OPS Specialist\n    • 1 Stage OPS\n\nDi seguito i dipendenti attuali, divisi per sede e tipologia di contratto.\n\n           Sede                     Apprendistato               Stage        TI      Totale complessivo\nMilano                                   2                                   3                5\nRoma                                     4                         1         6               11\nTotale complessivo                       6                         1         9               16\n                                               Fundraising\n\nCosaporto ha avviato un aumento di capitale per finanziare la crescita dei prossimi anni. La prima\nparte dell’operazione è stata conclusa nel mese di luglio con uno strumento finanziario partecipativo,\nche convertirà alla chiusura dell’aumento di capitale, per un totale di 750k€, così ripartiti:\n    • 300k dall’ingresso di 3 nuovi importanti soci\n    • 450k da Lazio Innova che ha finanziato per 1,5 volte la quota dei nuovi ingressi.\n\nL’aumento di capitale procederà con l’ingresso di un nuovo fondo in compagine societaria (Azimut) e\nil lancio di una campagna di Crowdfunding sulla piattaforma Mamacrowd, per consentire a clienti,\npartner e piccoli e grandi investitori privati di entrare in società con quote comprese tra i 500€ e i\n500.000€. al termine della campagna ci sarà un nuovo investimento da parte di Lazio Innova.\nLa campagna partirà l’11/10 e durerà circa un mese. L’aumento di capitale sarà ratificato nel corso\ndel mese di dicembre.\n\n                                           Principali KPI\n\nIn sintesi, nonostante la performance del primo trimestre, peggiorativa rispetto allo scorso anno per\nl’impatto della pandemia sugli ordini B2C, tutti gli indicatori di performance nel 2022 hanno fatto\nregistrare un miglioramento:\n     • Fatturato: +14%\n     • Ordini B2B: +90%\n     • Scontrino medio: +7%\n     • Ricavi da consegna: +2%\n     • Sconti: -27%"},{"label":"Maggio 2022","text":"Summary\n\nDopo due anni in cui la pandemia ha rivoluzionato le nostre vite, i primi mesi del 2022, finalmente “covid free”,\nrappresentano un ritorno verso la “normalità”. La pandemia, con tutte le misure di sicurezza adottate in questi\ndue anni, ha avuto effetti dirompenti su tutte le attività economiche. Il comparto “on line” (e-commerce e\ndelivery), ha fatto registrare dei picchi di crescita vertiginosi, anche da parte di clienti che avrebbero preferito\nil canale fisico. Passata l’emergenza c’è un fiosiologico riassestamento delle abitudini che comporta un\nsignificativo calo degli acquisti on line, in particolare del delivery, presente per lo più nelle grandi città, molto\nmeno popolate durante i weekend e i ponti/festività, vista anche la possibilità di tornare a viaggiare. I\nprincipali player di food delivery, per utilizzare un affidabile benchmark di mercato, stanno riportando cali di\nfatturato tra il 20 e il 30% rispetto al 2021.\nÈ all’interno di questo contesto che va analizzata la performance dei primi mesi dell’anno.\n\nLe peculiarità del modello di business di Cosaporto hanno consentito di annullare questo trend per una serie di\nmotivi:\n    • La fine dell’emergenza pandemica comporta il ritorno di una serie di occasioni d’uso attorno alle quali\n        Cosaporto è stata progettata fin dall’inizio: cene/feste in casa ed eventi in ufficio (colazioni, coffee\n        break, business lunch)\n    • La crescente domanda di same day delivery, che va ben oltre il “food delivery”, ma diventa un servizio\n        accessorio e strumento di upselling per e-commerce e punti vendita fisici cross-industry (fashion, luxury\n        e retail in generale). Cosaporto sta cavalcando il trend offrendo la soluzione Delivery As A Service\n        (DaaS) a tutti i partner in piattaforma e a tantissimi che non sono sul Marketplace (ad es. Dyson, K-\n        Way) che ne riconoscono la semplicità d’uso e la versatilità.\n    • La crescente visibilità e notorietà del brand ha consentito una serie di azioni commerciali, descritte in\n        seguito, volte ad incrementare i ricavi\n\nTutto questo ha consentito di affrontare il naturale calo dei volumi senza particolari impatti sul fatturato, che a\nfine maggio risulta sostanzialmente in linea a quello dell’anno precedente. (Nota: il fatturato di Maggio 2022,\nindicato in giallo, è una stima attendibile, non ancora consolidato)\n\n                                                   Commerciale\n\nDando continuità alle azioni iniziate nel corso del 2021 sono state definite le 3 business lines di Cosaporto con\nrelativa contrattualistica e pricing.\nÈ in corso un’azione di rinegoziazione con tutti i partner per aumentare la marginalità e introdurre linee di\nrevenue stabili e non variabili.\nIn sintesi:\n\n•   Marketplace (MP): servizio visibilità online + pickup dal negozio fisico di proprietà del brand\n    • Pricing: 20/25%\n    • Introdotta setup fee una tantum: totale fatturato al 31/05: circa 6.000€\n\n    • Introdotto minimo mensile: totale fatturato al 31/05: circa 5.400€\n    • Penali in caso di disservizi: totale fatturato al 31/05: circa 3.400€\n•   Dark Quality Store (DQS): servizio visibilità online + gestione magazzino + servizio di delivery dal DQS\n    Cosaporto\n    • Pricing: Prodotti in conto vendita, margine 30/35%\n    • Introdotto canone mensile: totale fatturato al 31/05: circa 3.000€\n•   Delivery as a Service (DaaS): servizio di sola delivery per ordini non provenienti dal cosaporto.it\n    • Pricing: prezzo delle consegne aumentato di circa il 10%\n    • Introdotto canone mensile: totale fatturato al 31/05: circa 2.000€\n\nPartner:\n• Nuovi Partner contrattualizzati sui canali Marketplace, DQS, DaaS: Dermalogica, Babasucco, Egalitè, Carre\n    Francaise, T’A Milano, Momo Design, Mercato Isola, Guido Gobino, Domori, Valrhona, Niko Romito, Filippo\n    La Mantia, Massari Firenze, Acetaia Giusti, ecc.\n• Principali partner con trattativa in corso per il servizio DaaS: Kway, Percassi, Brico, Save the Duck, CityLife\n    District\n• Continua rinegoziazione dei contratti in scadenza con\n         o Aumento della fee\n         o Introduzione di minimo mensile\n         o Introduzione di penali automatiche in caso di disservizi\n         o Introduzione exit fee in caso di uscita anticipata\n• Partner attuali: 380\n         o Di cui nuove attivazioni dal 2022: 55\n\nAlla luce della crescita della notorietà del brand stiamo mettendo in atto una serie di attività di marketing volte\nad aumentare il fatturato e la marginalità. Di seguito i principali esempi:\n• Online visibility: vendita pacchetti di visibilità per home page, newsletter, social, ecc. (es. Moet Hennessy)\n    – prezzo medio 800€/mese\n• Offline Events: condivisione della visibilità presso eventi offline (es. Design Week, Packaging Premiere,\n    ecc.) – 200€/giornata\n• Sampling Consegne: es. 3.500€ per azione di sampling su 2.000 consegne con omaggio Amaro Braulio\n• Progetto Forte dei Marmi: contrattualizzazione di una fee di 500€ per essere presenti con dark store\n    Cosaporto su Forte dei Marmi (es. Babasucco, Barilla Finger Food BluRhapsody, )\n\nSono state siglate partnership strategiche con brand importanti con i quali abbiamo realizzato attività di\ncomarketing e progetti speciali: BuddyBank, Frida’s, Cannavacciuolo, Save the Children for Ucraine, Vip District,\nTriple, Scalapay, Colvin, Fitprime, Interflora\n\nLa ripresa degli eventi fisici è il contesto ideale per continuare lo sviluppo della linea dedicata alle aziende,\nCosaporto4Business, con una serie di iniziative che si aggiungono al consolidato servizio di coffee break e\nbusiness lunch:\n• Ridefinizione della strategia di sviluppo del canale corporate con focus su retention con comunicazioni\n    mirate in funzione dei comportamenti di acquisto (Marketing automation)\n• Hotellerie: siglato accordo con varie realtà per room service breakfast (es. Gruppo UNA Esperienze, Mamis\n    Hotel, Hotel delle Regioni, ecc..)\n• Convenzione e servizio catering presso Fiera Milano con Packaging Premiere\n• Definizione dell’accordo per gestione Bar presso Circolo Filologico Design Week\n\n                                                      Team\n\nIntroduzione di alcune nuove figure:\n     • UX specialist\n     • OPS Specialist\n     • Product Specialist (ex Stage)\n     • CM Roma\n     • CM Bologna e Firenze\n     • BD con focus su Dark Store e Hotellerie\n\nDi seguito i dipendenti attuali, divisi per sede e tipologia di contratto.\n\nSede                           Apprendistato         Stage           TD               TI         Totale complessivo\nMilano                              2                  1              2               4                           9\nRoma                                5                  1              1               3                          10\nTotale complessivo                  7                  2              3               7                          19\n\n                                                 UX – Nuovo sito\n\nNella seconda metà del mese di maggio è andata live la release 1.0 del nuovo sito di Cosaporto.\nLa realizzazione del nuovo sito fa parte dell'ultima fase di rebranding di Cosaporto iniziata l'anno scorso con\nil redisign del logo. Contorni più morbidi e arrotondati, e colori più brillanti. Il nuovo sito nasce dall'esigenza di\nmigliorare l'interfaccia utente, sempre al centro delle nostre analisi e del nostro marketing. L’analisi ha tenuto\nconto dei feedback dei clienti, raccolti tramite survey e focus group specifici.\n\nI principali cambiamenti del nuovo sito sono:\n     • Miglioramento estetico nella presentazione dei nostri partner e dei prodotti\n     • Sezioni “Partner in evidenza” e “Prodotti in evidenza” gestita seguendo logiche di visibilità a\n         pagamento per i partner\n     • Navigazione per categoria di prodotto e filtri di ricerca potenziati\n     • Maggior risalto alle occasioni d’uso per fornire subito ai clienti nuovi spunti per acquisti\n     • Selezione veloce dei prodotti in funzione della data di consegna richiesta (subito, in giornata, domani,\n         altra data) per evitare l’effetto delusione di chi sceglie un prodotto e successivamente scopre non essere\n         disponibile quando desiderato\n     • Le dichiarazioni dei nostri partner in home page. Volti riconosciuti dal pubblico che aumentano la fiducia\n         in Cosaporto per chi arriva per la prima volta sul sito\n     • Area dedicata alle aziende, con dettaglio dei servizi offerti e possibilità di stipulare convenzioni o\n         accordi\n     • Focus sui punti di forza del servizio\n     • Grande risalto alle recensioni dei nostri clienti su Trustpilot (voto: “Eccezionale”, 4,6/5)\n     • Redesign delle schede prodotto, per dare maggior visibilità alle informazioni principali\n     • Miglioramento del flusso di pagamento\n     • Ottimizzazione di tutta la navigazione da mobile\n\nSono state sviluppate due logiche diverse di upselling/crosselling, in funzione della fase del processo di\nacquisto:\n   • In fase di scelta prodotto: sulla scheda prodotto il sistema propone una serie di alternative afferenti\n        alla stessa categoria, in modo da offrire al cliente una soluzione nel caso in cui il prodotto che sta\n        visualizzando non incontrasse il suo gradimento\n   • Al carrello: quando il cliente ha già selezionato almeno un prodotto il sistema propone altro da\n        abbinare (“Spesso acquistati insieme”, ad esempio: Torta➔Champagne)\n\nIl team seleziona un sottoinsieme dei prodotti a catalogo in base a una serie di parametri qualitativi (qualità\ndelle foto, appeal del partner e del prodotto). Tra questi l’algoritmo sceglie quali proporre al cliente in base\na parametri oggettivi, quali:\n      • marginalità del partner\n      • distanza tra i punti vendita, per ottimizzare la logistica\n      • negozi/prodotti più apprezzati dai clienti\n      • prodotto presente nel Dark Store Cosaporto\n      • stagionalità\n\nCome detto in precedenza, quella on line è la prima release del nuovo sito. È in corso la realizzazione della\nseconda release prevista nel mese di settembre. Tra le principali novità previste ci sarà un search engine\nevoluto, realizzato grazie alla partnership di un provider specializzato (Algolia), che garantirà agli utenti\nun’esperienza d’uso migliore nello scegliere tra le oltre ventimila referenze attualmente a catalogo.\nAltra importante novità sarà una feature che consente ai clienti già registrati di saltare alcune fasi di check-out\ne concludere l’acquisto più velocemente.\n\n                                                       CRM\n\nNel corso del mese di aprile è terminata l’integrazione con un CRM realizzato su piattaforma Hubspot. Il\nprogetto era partito da un approfondita analisi dei principali player sul mercato fino ad individuare in Hubspot,\ntra i leader mondiali del settore, la piattaforma As A Service più adatta alle nostre esigenze. Parallelamente\nabbiamo sondato vari business integrator specializzati in integrazioni Hubspot fino a scegliere una società\nitaliana, Exelab, che si è rivelato partner ideale sia per la capacità di portare a termine il progetto nel migliore\ndei modi, sia per il supporto fornito lato business nell’analisi dei comportamenti di acquisto e nella definizione\ndi una serie di azioni di diversa entità (da quick win a iniziative progettuali molto strutturate) finalizzate ad\naumentare tassi di conversione e LTV.\nQuesto tipo di analisi si integra perfettamente con il lavoro portato avanti sul nuovo sito fornendo tutta una\nserie di spunti su nuove features o revisioni di processo che saranno messe in pipeline nei prossimi mesi.\n\nIl principale obiettivo del progetto è però quello di centralizzare tutte le informazioni (dalle comunicazioni con\ni clienti, ai dati di navigazione, ai comportamenti di acquisto) per intraprendere una serie si azioni puntuali e\nspecifiche su gruppi di utenti ben definiti. Il radicale cambio di paradigma è quindi disegnare una\ncomunicazione sempre più tailored, mirata, in funzione dei comportamenti di acquisto e delle preferenze\nespresse dal singolo cliente, in modo da razionalizzare il numero di comunicazioni e renderle maggiormente\nefficaci.\n\nIl passo successivo è stata la ridefinizione di tutta la strategia di retention personalizzandolo in base ai\ncomportamenti d’acquisto.\n\nLe logiche utilizzate per costruire dei flussi personalizzati per i singoli clienti sono riassunte di seguito:\n     • Definizione Buyer Personas: sono stati identificati dei cluster di clienti in base al loro comportamento di\n         acquisto. Ciascun cluster riceve comunicazioni mirate a intervallo di tempo predefinito e variabile in\n         base al cluster. Alcuni cluster già identificati sono:\n             o Altospendenti: scontrino medio maggiore di un parametro variabile per città\n             o Bassospendenti: scontrino medio minore di un parametro variabile per città\n             o Affezionati: clienti con frequenza d’acquisto elevata\n             o Asociali: clienti che utilizzano il servizio nella maggior parte dei casi per se stessi e non, come\n                  la maggior parte dei clienti, per regali\n             o Dormienti: clienti con un numero di ordini elevati ma ultimo ordine lontano nel tempo\n             o Turisti: uno o due ordini, l’ultimo almeno due mesi fa\n             o Occasionali: almeno tre ordini, l’ultimo almeno due mesi fa\n\n    •   Flussi di marketing automation standard: sono flussi destinati ad andare a recuperare clienti inattivi da\n        tempo o utenti che si sono registrati senza concludere il primo acquisto. Questi flussi hanno tempistiche\n        e contenuti diversi a seconda del comportamento e hanno l’obiettivo di presentare le caratteristiche del\n        servizio oppure le principali novità o promozioni in atto\n    •   Flussi innescati da eventi: per stimolare nuovi acquisti in funzione di eventi passati, ad esempio:\n             o Anniversario del primo ordine su Cosaporto\n             o Compleanno dell’utente\n             o Anniversario di un ordine regalo (“Un anno fa hai fatto un regalo a xxx”)\n\nA quest’ultima categoria appartiene anche un flusso denominato “Le mie occasioni speciali”, legato ad una\nfunzionalità che consente al cliente di registrare nel suo account una serie di occasioni (Ad esempio: “15 luglio,\ncompleanno Moglie, preferenza fiori”) e ricevere con qualche giorno di anticipo una serie di proposte scelte\nda un algoritmo.\n\nNaturalmente le logiche di clusterizzazione e i relativi flussi sono continuamente soggetti a monitoraggio, analisi\ndei risultati, A/B test, fine tuning.\n\n                                                   Principali KPI\n\nNel corso del mese di aprile Cosaporto ha compiuto 5 anni di vita, di seguito i principali KPI, declinati su base\nannuale.\n\nCome detto in apertura, le iniziative messe in campo nel corso di questi mesi sono riuscite a bilanciare il\nprevedibile calo di ordini B2C mantenendo stabili i ricavi; questo risultato rappresenta un unicum nel panorama\nitaliano dei delivery, dove in media i risultati parlano di un calo tra il 20% e il 30% rispetto al 2021.\n\nCosaporto, grazie alla piattaforma tecnologica, ai processi e all’esperienza di questi anni, sta cavalcando la\ncrescita vertiginosa della domanda di same day delivery che rappresenta sempre più un servizio che il retail\nvuole offrire ai propri clienti, integrando i canali fisici e digitali; oltre l’80% dei partner in piattaforma utilizza\ncon continuità il servizio. A questi si aggiungono nuovi e importanti partner commerciali che, pur non essendo\npresenti sul marketplace per scelta strategica o di posizionamento, hanno scelto Cosaporto come provider; tra\ni principali Dyson (che dopo un periodo di sperimentazione su Milano ha deciso di estendere anche a tutti i\npunti vendita delle principali città italiane) e K-Way. Trattative sono in corso con altri importanti brand.\n\nLato Marketplace, Cosaporto conferma il posizionamento esclusivo che comporta un ticket medio molto alto e\nancora in crescita (+30% rispetto a 2 anni fa). Rispetto ai tipici food delivery lo scontrino medio è circa il triplo,\ncon impatto fortissimo sul conto economico. Questo è un diretto effetto del modello di business che punta un\nsegmento di clientela esigente e con elevata potenzialità di spesa e va a intercettare una serie di occasioni\nd’uso che naturalmente portano una spesa elevata, sia lato consumer (regali, anniversari, occasioni speciali,\nfestività) che corporate (eventi aziendali, regalistica).\n\nPer quanto riguarda le consegne nel corso degli ultimi due anni, complice la situazione pandemica e il\nconseguente aumento della domanda, è stato aumentato. Nel corso di questi mesi sono in atto azioni per\nriportarlo sui valori dei due anni precedenti."}];
const order=['revenues','revenues_b2c','revenues_b2b','rpf','aov','gm1','gm2','ebitda','salaries','mktg','travel','overhead'];
const cardOrder=['revenues','revenues_b2c','revenues_b2b','rpf','aov','gm1','gm2','ebitda','salaries','mktg','travel','overhead'];
const italian=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
let state={month:7,mode:'cumulative',show2024:true,show2025:true};
const month=document.getElementById('month');italian.forEach((m,i)=>{let option=document.createElement('option');option.textContent=m;option.value=i;month.appendChild(option)});month.value=7;
function valid(v){return typeof v==='number'&&Number.isFinite(v)}
const integerFmt=new Intl.NumberFormat('it-IT',{maximumFractionDigits:0,useGrouping:true});
function fmt(v,type){if(!valid(v))return '—';if(type==='currency')return new Intl.NumberFormat('it-IT',{maximumFractionDigits:1}).format(v)+'k €';if(type==='euro')return new Intl.NumberFormat('it-IT',{maximumFractionDigits:0}).format(v)+' €';return new Intl.NumberFormat('it-IT',{style:'percent',maximumFractionDigits:1}).format(v)}
function delta(a,b,type,inverse=false){if(!valid(a)||!valid(b))return {txt:'n.d.',bad:false};if(type==='currency'||type==='euro'){let d=(a/b)-1;return {txt:(d>=0?'+':'')+new Intl.NumberFormat('it-IT',{style:'percent',maximumFractionDigits:1}).format(d),bad:inverse?d>0:d<0}}let d=a-b;return {txt:(d>=0?'+':'')+new Intl.NumberFormat('it-IT',{style:'percent',maximumFractionDigits:1}).format(d)+' pt',bad:inverse?d>0:d<0}}
function renderCards(){const el=document.getElementById('summary');el.innerHTML='';cardOrder.forEach((k,i)=>{let m=DATA.metrics[k],a=m[state.mode]['2026'][state.month],b=m[state.mode]['2025'][state.month],inverse=['mktg','salaries','travel','overhead'].includes(k),d=delta(a,b,m.type,inverse);let card=document.createElement('article');card.className='kpi';card.style.setProperty('--accent',i<4?'var(--indigo)':i<8?'var(--teal)':'var(--gold)');card.innerHTML=`<div class="kpi-name">${m.label}</div><div class="kpi-value">${fmt(a,m.type)}</div><div class="compare"><div class="prior">2025<strong>${fmt(b,m.type)}</strong></div><span class="delta ${d.bad?'bad':''}">${d.txt}</span></div>`;el.append(card)})}
function draw(canvas,metric){
  const dpr=Math.max(1,devicePixelRatio||1),w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;let c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);
  let pad={l:46,r:74,t:18,b:25};let years=['2026'];if(state.show2025)years.unshift('2025');if(state.show2024)years.unshift('2024');
  let series=years.map(y=>metric[state.mode][y].slice(0,state.month+1).map(v=>valid(v)?v:null));let vals=series.flat().filter(valid);if(!vals.length)return;
  let min=Math.min(...vals),max=Math.max(...vals);if(min>0)min=0;if(max===min)max=min+1;let extra=(max-min)*.12;min-=extra;max+=extra;
  let x=i=>pad.l+(w-pad.l-pad.r)*(state.month?i/state.month:.5),y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-min)/(max-min));
  c.font='10px Avenir, "Avenir Next", Arial';c.fillStyle='#757578';c.textAlign='right';c.textBaseline='middle';c.strokeStyle='#e7e6e2';c.lineWidth=1;
  for(let i=0;i<4;i++){let yy=pad.t+(h-pad.t-pad.b)*i/3;c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();let val=max-(max-min)*i/3;c.fillText(metric.type==='currency'?integerFmt.format(Math.round(val)):integerFmt.format(Math.round(val*100))+'%',pad.l-7,yy)}
  c.textAlign='center';DATA.months.slice(0,state.month+1).forEach((m,i)=>{if(state.month<7||i%2===0||i===state.month)c.fillText(m,x(i),h-8)});
  years.map(yr=>[yr,yr==='2024'?'#e6aa1e':yr==='2025'?'#6e141e':'#0a6e5a']).forEach(([yr,col],seriesIndex)=>{
    let arr=metric[state.mode][yr].slice(0,state.month+1);c.strokeStyle=col;c.lineWidth=yr==='2026'?3:2;c.setLineDash(yr==='2024'?[2,4]:yr==='2025'?[6,4]:[]);c.beginPath();let started=false;
    arr.forEach((v,i)=>{if(!valid(v))return;started?(c.lineTo(x(i),y(v))):(c.moveTo(x(i),y(v)),started=true)});c.stroke();c.setLineDash([]);
    arr.forEach((v,i)=>{if(!valid(v))return;c.fillStyle=col;c.beginPath();c.arc(x(i),y(v),yr==='2026'?3.5:2.5,0,Math.PI*2);c.fill()});
    let last=-1;for(let i=arr.length-1;i>=0;i--){if(valid(arr[i])){last=i;break}}if(last>=0){let label=metric.type==='currency'?integerFmt.format(arr[last])+'k':new Intl.NumberFormat('it-IT',{style:'percent',maximumFractionDigits:1}).format(arr[last]);let offsets={2026:-11,2025:6,2024:20};c.font='700 10px Avenir, "Avenir Next", Arial';c.textAlign='left';c.textBaseline='middle';c.lineWidth=4;c.strokeStyle='#fff';c.strokeText(label,x(last)+7,y(arr[last])+offsets[yr]);c.fillStyle=col;c.fillText(label,x(last)+7,y(arr[last])+offsets[yr])}
  })
}
function renderCharts(){let el=document.getElementById('charts');el.innerHTML='';order.forEach(k=>{let m=DATA.metrics[k],card=document.createElement('article');card.className='chart-card';card.innerHTML=`<div class="chart-head"><h3>${m.label}</h3><span>${state.mode==='monthly'?'Dato del mese':'Progressivo YTD'}</span></div><canvas></canvas>`;el.append(card);draw(card.querySelector('canvas'),m)})}
function render(){document.getElementById('periodText').textContent=`${state.mode==='monthly'?'Mese':'Gennaio –'} ${italian[state.month]} 2026`;renderCards();renderCharts()}
render();
const quarterSelect=document.getElementById('quarterSelect'),quarterText=document.getElementById('quarterText');REPORTS.forEach((r,i)=>{let option=document.createElement('option');option.textContent=r.label;option.value=i;quarterSelect.appendChild(option)});
function renderQuarter(){let report=REPORTS[+quarterSelect.value||0];document.getElementById('quarterTitle').textContent=`Quarterly Report – ${report.label}`;quarterText.textContent=report.text}
quarterSelect.onchange=renderQuarter;try{renderQuarter()}catch(error){document.getElementById('quarterTitle').textContent='Quarterly Report';quarterText.textContent='Seleziona un report dal menu.'}
month.onchange=e=>{state.month=+e.target.value;render()};document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('active',x===b));state.mode=b.dataset.mode;render()});document.getElementById('show2024').onchange=e=>{state.show2024=e.target.checked;renderCharts()};document.getElementById('show2025').onchange=e=>{state.show2025=e.target.checked;renderCharts()};let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderCharts,100)});
</script></body></html>
