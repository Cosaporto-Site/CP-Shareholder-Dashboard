<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosaporto Financial Dashboard</title>
<style>
:root{--ink:#3b3b3d;--muted:#757578;--paper:#f7f6f3;--card:#fff;--gold:#e6aa1e;--burgundy:#6e141e;--teal:#0a6e5a;--indigo:#282864;--line:#e5e4df;--good:#0a6e5a;--bad:#9a2632}
*{box-sizing:border-box}html,body,button,input,select,option,h1,h2,h3,div,span,label,strong,canvas{font-family:Avenir,"Avenir Next","Segoe UI",Arial,sans-serif}body{margin:0;background:var(--paper);color:var(--ink)}.shell{max-width:1500px;margin:auto;padding:10px 30px 48px}
header{display:grid;grid-template-columns:300px 1fr 180px;align-items:center;gap:24px;margin-bottom:10px}.logo-img{width:285px;height:72px;object-fit:contain;display:block}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:var(--burgundy);font-weight:800;margin-bottom:3px}h1{margin:0;font-family:Avenir,"Avenir Next","Segoe UI",Arial,sans-serif;font-size:clamp(24px,3vw,40px);font-weight:800;letter-spacing:-1.5px}.date{font-size:12px;color:var(--muted);text-align:right}
.controls{background:var(--indigo);color:#fff;padding:14px 16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px;box-shadow:0 8px 22px #2828641c}.control-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;opacity:.7}#periodText{font-family:Avenir,"Avenir Next","Segoe UI",Arial,sans-serif}.select{appearance:none;background:#fff;color:var(--ink);border:0;border-radius:10px;padding:11px 38px 11px 14px;font:600 13px Avenir,"Avenir Next",Arial;outline:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px;background-repeat:no-repeat}.seg{display:flex;background:#1d1d55;border-radius:10px;padding:3px}.seg button{border:0;background:transparent;color:#d0d0e8;padding:9px 15px;border-radius:8px;font:700 12px Avenir,"Avenir Next",Arial;cursor:pointer}.seg button.active{background:white;color:var(--indigo)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;margin-bottom:22px}.kpi{background:var(--card);border:1px solid #e7e7e2;border-radius:16px;padding:16px;min-height:134px;position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:var(--accent,var(--burgundy))}.kpi-name{font-size:11px;text-transform:uppercase;letter-spacing:.75px;color:var(--muted);font-weight:800;min-height:28px}.kpi-value{font-size:clamp(22px,2vw,31px);font-weight:800;letter-spacing:-1.4px;margin:5px 0 8px}.compare{display:flex;justify-content:space-between;align-items:end;gap:8px;font-size:11px;color:var(--muted)}.delta{font-weight:800;border-radius:99px;padding:4px 7px;background:#e7f3ef;color:var(--good)}.delta.bad{background:#f7e9eb;color:var(--bad)}.prior strong{display:block;color:var(--ink);font-size:12px;margin-top:2px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 11px}.section-title h2{font-size:17px;margin:0;letter-spacing:-.4px}.legend{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted)}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.year-toggle{display:flex;align-items:center;gap:5px;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-weight:700}.year-toggle input{margin:0;accent-color:var(--teal)}.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.chart-card{background:var(--card);border:1px solid #e7e7e2;border-radius:17px;padding:16px}.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.chart-head h3{font-size:13px;margin:0}.chart-head span{font-size:10px;color:var(--muted)}canvas{width:100%;height:190px;display:block}.quarterly{margin-top:30px;background:var(--card);border:1px solid #e7e7e2;border-radius:18px;overflow:hidden}.quarterly-top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:17px 18px;background:var(--indigo);color:#fff}.quarterly-top h2{margin:0;font-size:18px}.quarter-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.quarterly-top .select{min-width:180px}.action-btn{border:1px solid #ffffff52;border-radius:9px;padding:10px 13px;background:#ffffff12;color:#fff;font-size:12px;font-weight:700;cursor:pointer}.action-btn:hover{background:#ffffff25}.action-btn:disabled{opacity:.45;cursor:not-allowed}.action-btn.primary{background:var(--gold);border-color:var(--gold);color:#292423}.quarterly-body{padding:22px 24px}.quarterly-body h3{margin:0 0 16px;font-size:22px;color:var(--burgundy)}.report-text{white-space:pre-wrap;font-size:13px;line-height:1.62;max-height:650px;overflow:auto;padding-right:18px;color:#444}.report-text::-webkit-scrollbar{width:8px}.report-text::-webkit-scrollbar-thumb{background:#cbc9c2;border-radius:8px}.report-editor{display:none;width:100%;min-height:520px;resize:vertical;border:1px solid #c9cbc8;border-radius:12px;padding:16px;font-size:13px;line-height:1.62;color:#333;background:#fffdf8;outline:none}.report-editor:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0a6e5a16}.editor-actions{display:none;align-items:center;gap:8px;margin-top:12px}.editor-actions .action-btn{color:var(--ink);border-color:var(--line);background:#f5f4f0}.editor-actions .action-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.save-note{font-size:11px;color:var(--teal);font-weight:700;margin-left:6px}.foot{margin-top:18px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:1050px){header{grid-template-columns:250px 1fr}.logo-img{width:235px}.date{display:none}.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.shell{padding:6px 14px 36px}header{display:block}.logo-img{width:230px;height:58px;margin-bottom:2px}.controls{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:repeat(2,1fr)}.section-title{align-items:flex-start;flex-direction:column;gap:10px}.charts{grid-template-columns:1fr}.kpi{min-height:128px}.quarterly-top{align-items:flex-start;flex-direction:column}.quarter-tools,.quarterly-top .select{width:100%}.quarter-tools .select{flex:1}.quarterly-body{padding:18px 16px}.report-text{font-size:12px}.report-editor{min-height:430px}}@media(max-width:430px){.summary{grid-template-columns:1fr}.control-group{width:100%}.select{flex:1}.seg{width:100%}.seg button{flex:1}}
</style></head><body><main class="shell">

const REPORTS=[{"label":"Q2 2026","text":"Executive Summary\n\nLa strategia di crescita e sostenibilità per il 2026 continua sulle traiettorie dei mesi passati.\n\nI ricavi sono circa il 32% + alti del 2025 e l’Ebitda è sostanzialmente pari a zero rispetto a un -100k\ndello scorso anno.\nIl B2B cresce del 70% e il B2C sta lentamente calando verso un volume ormai organico e senza\ninvestimenti.\nRaddoppiati i clienti B2B e i deal gestiti.\nPiù che raddoppiati anche le Revenues x FTE a conferma della assoluta attenzione all’efficienza dei\nprocessi sempre più abilitata dalla massiccia introduzione dell’AI ormai in quasi tutti i processi\ngestionali e commerciali\n\nUn quarter di conferme sotto tutti i punti di vista. Commerciale, marketing, partnership, team e\ntecnologia.\n\nPipeline commerciale molto incoraggiante (x3 rispetto al 2025) e alcuni deal di Natale già chiusi.\n\nStiamo incrementando il numero di Partner Catering facendo entrare i nomi più importanti a livello\nnazionale. Segno che anche lato offerta c’è molto interesse e di fatto unicità del modello sul mercato.\n\nInseriti anche contratti stabili come la gestione del bistrot interno di Heineken (subappaltato poi a un\nnostro partner) e la fornitura stabile settimanale di colazioni o pranzi (Bending Spoons, Airbnb, Sum\nup). In corsa per gestione Bistrot Hangar Bicocca Pirelli.\n\nTeam stabile ormai da 4 mesi. Un bel mix di senior stabili e junior che crescono bene.\n\nPiano per prossimo Q\n•⁠ ⁠Luglio: chiudere big deal Natale e creare Pipeline per Settembre con campagne outreach e\nretention. Sistemare tutti i processi IT per il Natale, chiudere partnership commerciali di Dropshipping\n•⁠ Agosto: periodo ovviamente fermo totale ma con ultima settimana da sfruttare per chiudere deal\nNatale e prendere eventi di back to work a Settembre\n•⁠ Settembre: push forte su Gifting Natale, ⁠completare progetti di automazione AI based per invio e\ngenerazione preventivi\n\nKPI\n\nQuesta la fotografia del team al 30/06/26.\n\n     Sede         Apprendistato       Stage   TD   TI   Totale\nMilano                 2                0      0   1      3\nRoma                   1                1      0   4      6\nTotale                 3                1      0   5      9"},{"label":"Q1 2026","text":"Executive Summary\n\nLa strategia di transizione verso un modello di business full B2B continua senza sosta.\nIl B2C ormai è solo organico ma tutto l’effort e investimenti sono rivolti al B2B.\n\nAvendo continue conferme sulla sostenibilità del nuovo modello di business e soprattutto sulla nostra\ndistintiva value proposition nel mercato, abbiamo ricominciato a spingere per la crescita ma ancora\nin modo controllato e sempre molto attenti alla marginalità.\n\nGli investimenti in marketing e sugli strumenti di outreach automation danno ottimi segnali di ritorno\nimmediato sull’investimento anche grazie alla continua attività di rafforzamento offerta e\ntrasformazione del sito come unico sito italiano di delivery dedicato al B2B.\n\nRevenues +40% vs 2025. Revenues B2B raddoppiate, Revenues B2C dimezzate.\nMedia eventi B2B giornalieri: 5.\nIl 18 Marzo abbiamo gestito 14 eventi.\n\nEBITDA positivo tutti i mesi (+7% YTD vs -25% del 2025)\n\nClienti e deal B2B più che raddoppiati anche grazie ad un aumento importante della conversion delle\nlead (online e offline) arrivate.\n\nTeam stabile a 7 FTE (16 a Marzo 2025) con progressivo aumento di seniority.\n\nPiano per prossimo Q\n•⁠ ⁠sfruttare al massimo alta stagione eventi aziendali\n•⁠ ⁠generare lead per Natale\n•⁠ ⁠completare progetti di automazione AI based per invio e generazione preventivi\n•⁠ ⁠aumento offerta Partner dropshipping per alleggerire operations Natale\n•⁠ ⁠aumento offerta Partner Catering su RM e TO\n•⁠ ⁠trovare BDR\n•⁠ ⁠vendita white label piattaforma delivery “as a service”\n\n                                                 KPI\nRevenues e Scontrino medio\n\nEventi e clienti B2B gestiti | Revenues per FTE\n\nMargini\n\nCosti"},{"label":"Q4 2025","text":"Executive Summary\n\nRileggendo il Quarterly report di un anno fa (vedi pag. 22) possiamo dire di aver messo in atto\nampiamente la strategia definita a inizio anno.\nIl 2025 è stato l’anno del definitivo passaggio al nuovo modello di business che vede come target\nesclusivo il B2B.\nCi siamo, quindi, concentrati esclusivamente su:\n    - Analisi e comprensione Mercato B2B (target, competitors, partnership)\n    - Test & Learn campagne off e online di acquisition clienti\n    - Sostenibilità del modello di business e analisi metriche principali\n    - Efficienza di costi e snellimento operatività\n    - Sviluppo mirato di processi e sistemi tecnologici e CRM funzionali alla marginalità\n    - Consolidamento del team storico e inserimento di persone giovani a basso costo e veloce\n        execution\n    - Sinergie strategiche con operatori logistici specializzati per il Corporate Gifting e sviluppo\n        modello Dropshipping\n\nMercato\nCosaporto grazie anche a tutta l’esperienza sviluppata nei passati 7 anni ha un modello che in questo\nmercato può essere assolutamente distintivo e riconosciuto dai clienti. C’è molto spazio, è un mercato\nancora frammentato e nessuno riesce ad offrire un mix di tecnologia, posizionamento di brand ed\nefficienza operativa come Cosaporto.\n\nClienti\n    • Il nostro CRM (Hubspot) conta oltre 2.000 clienti B2B attivi e altrettante lead calde da\n        sviluppare.\n    • Il grado di sodisfazione sui 923 eventi e regali gestiti nel 2025 è per il 92% “Ottimo” e\n        “Buono” (da survey clienti post evento)\n    • Abbiamo clienti ormai stabili e che ci utilizzano sia per Catering sia per Gifting come: Bending\n        Spoons, Dior, Satispay, Paypal, Mastercard, Amazon, TikTok, Italgas, Booking, Meta, Fendi,\n        Ernesto Meda, Novartis, Shiseido.\n\nOfferta e Partnership\nAbbiamo ridotto tantissimo le Partnership negozi tenendo solo quelle di alto valore e che potessero\nsviluppare un’offerta B2B, riuscendo quindi ad offrire al cliente aziendale la combinazione tra\nprodotto pensato per il suo use case in ufficio e il brand famoso della città.\nI Partner dal canto loro sono contenti di sviluppare con noi questa offerta ad alto scontrino medio e\ntotalmente nuova.\nBasti pensare che uno di questi su Milano nel 2025 ha fatturato con noi oltre 200k a scontrino medio\ndi 1.200 euro.\n\nAbbiamo introdotto il modello “Dropshipping” che ci ha permesso soprattutto a Natale di offrire\nprodotti e soluzioni di regalo di altissimo livello con brand presenti in tutta Italia delegando totalmente\nla fase di spedizione al Partner, ma con la governance vs il cliente sempre nostra, grazie\nall’integrazione dei sistemi e dei processi con ogni singolo Partner.\n\nSempre per il Natale in ottica “full outsourcing” abbiamo collaborato con un operatore logistico\nspecializzato in packing e shipping che ci ha permesso (anche qui grazie ad un progetto di\nintegrazione sistemi) di azzerare qualsiasi operation lato nostro e soprattutto di avere costi per ordine\ngià stabiliti e quindi inseriti a margine nelle offerte ai clienti finali.\n99% delle consegne andate a buon fine su un totale di oltre 6.000 spedizioni nell’arco di 3 settimane\ndi Dicembre.\n\nTeam\nDa 15 (+ 3 consulenti esterni) a 7 (+ 1 consulente esterno) mantenendo sostanzialmente le stesse\nRevenues e andando vicino ad Ebitda zero.\nE’ uscito Alessandro ma le colonne storiche di Cosaporto sono sempre più solide e in grado di guidare\nCosaporto attraverso la sua trasformazione e sviluppo.\n\nAbbiamo cambiato in corsa modo di lavorare e di gestire il business, i clienti non arrivano più solo\ndal marketing online ma bisogna andarseli a prendere, con l’AI che fa risparmiare tempo da\ndedicare a visite fisiche, eventi di pr e lead acquisition e conoscenza del cliente.\nProcessi in tiro, sistemi interni efficaci, l’inizio dell’introduzione dell’AI stabile nei nostri processi che\npermettono di inserire risorse giovani e renderli operativi a tempo zero.\n\nRisultati 2025 (gestionali non da bilancio)\n   • Ricavi leggermente sotto al 24, abbiamo scelto consapevolmente di concentrarci sulla bottom\n        line e quindi solo deal con marginalità sana e sicura. Marketing B2C azzerato, quello B2B solo\n        con metriche sane (ROAS >5) e molti test per il futuro.\n   • GM1, GM2 e Scontrino Medio in netto aumento. Quasi solo B2B e con deal sempre più\n        grandi.\n   • EBITDA vicino allo zero (da -1M nel 23 e -600k nel 24)\n        Costi ormai al minimo, tutti rivisti e tutti rinegoziati, personale con piramide di costi\n        abbassata e con un numero di persone che svolge solo attività di vendita e pochissimo\n        overhead.\n\nPiano 26 e Strategia\nCrescere. Ma sani e solidi. Dimostrare stabilmente, tutti i mesi che il modello di business è scalabile,\nche la tecnologia può fare la differenza, che le persone crescono e che si possono produrre profitti\nreali.\nPiano di dettaglio al prossimo Quarterly Report.\n\n                                               KPI\nRevenues e Margini\n\nCosti\n\nQuesta la fotografia del team al 31/12/25.\n\n        Sede      Apprendistato       Stage   TD   TI   Totale\n\nMilano                2   1   0   0    3\nRoma                  1   0   0   4*   5\nTotale                3   1   0   4    8\n\n*1 FTE in Maternità"},{"label":"Q3 2025","text":"Executive Summary\n\nI risultati del Q3 2025 sono la conferma definitiva della bontà del cambio di strategia intrapreso a\npartire dallo scorso anno.\nIl B2B si sta dimostrando un modello di business sostenibile, scalabile e dove Cosaporto può\nconquistare in maniera distintiva una posizione molto riconoscibile e netta.\nL’esperienza e gli asset sviluppati negli anni soprattutto in termini di posizionamento dei brand partner,\ntecnologia e algoritmi, processi di crm e retention ci permettono di offrire una soluzione unica sul\nmercato alle aziende che vogliono un servizio di catering e gifting di livello ma al tempo stesso\nseamless, completo e semplice\n\nRisultati Q3 2025\n   • Ricavi leggermente sotto al piano, anche in considerazione dell’accelerazione del taglio del\n        B2C e anche per un focus netto sulla marginalità che ci sta facendo dire no ad alcuni deal b2b\n        che presentavano una marginalità troppo bassa. Negli anni scorsi li avremmo comunque fatti\n        pensando alla crescita e ai ricavi, quest’anno no.\n   • GM1, GM2 e Scontrino Medio in netto aumento. Aumenta il B2B ormai quasi esclusivo e\n        aumentano le dimensioni dei deal B2B. Noi siamo più strutturati con l’offerta anche non solo\n        food (location, servizi ecc) e i clienti storici che rimangono e sono contenti ci affidano via via\n        deal sempre più complessi.\n   • EBITDA in forte recupero (da -39% del Q3 cumulato del 2024 a -9% del 2025), Con un\n        ebidta del mese di Settembre più alto di gran lunga di sempre.\n        Costi ormai al minimo, personale con piramide di costi abbassata e con un numero di persone\n        che svolge solo attività di vendita e pochissimo overhead. Il calo del B2C ci ha permesso di\n        ottimizzare i costi dedicati ad operations, customer care, maintenance del sito e backend,\n        marketing e tutte le operations (es. per Gifting Natale) sono state date in outsourcing ad\n        operatori specializzati che ci consentono di abbassare i costi, renderli variabili e assolutamente\n        misurabili e imputabili al singolo deal, in modo di permetterci in modo scientifico di ribaltarli\n        con margine al cliente finale. Rinegoziati in maniera molto decisa tutti gli altri costi (CRM,\n        affitti, server, ecc).\n\n                                    KPI\n\n                                  TOP LINE\n\n           REV - YTD                                B2B REV - YTD\n                 1,418                                                 75%\n                          1,252                    63%\n   1,030                                                       57%\n\n                                                         23     24    25\n           23      24    25\nAverage Order Value - YTD                           AOV - MONTHLY\n                          159.0\n                                                         188               202\n                 84.3\n    67.2                                                       142               130\n                                             99 86 114\n\n            23      24   25               Jan Feb Mar Apr May Jun Jul Aug Sep\n\n                               MARGINALITA’\n\n  GM1 % - YTD                                        GM2 % - YTD\n                                                                     16%\n                  34%\n\n           22%\n                                                              -2%\n12%\n\n                                                  -37%\n      23    24   25                                      23    24   25\n\n                         EBIDTA % - YTD\n\n                                            -9%\n                                    -32%\n\n                        -96%\n\n                               23    24    25\n\n                                     COSTI\n                              Impatto su Revenues\n\n   MKTG/REV - YTD                                   SALARIES/REV - YTD\n   35%                                               82%\n\n                                                                 46%\n                                                                         38%\n              12%\n                     7%\n\n         23    24   25                                      23    24    25\n\nFACILITIES-IT-OTHER/REV                        TOTAL OVERHEAD/REV - YTD\n          - YTD\n                                                     100%\n   19%\n                                                                 49%\n              9%                                                             39%\n                         8%\n\n         23    24   25                                      23     24   25\n\n                                             PEOPLE\n\nQuesta la fotografia del team al 30/09/25.\n\n    Sede         Apprendistato       Stage            TD   TI   Totale\nMilano                1                1               0   1      3\nRoma                  0                1               0   4      5\nTotale                1                2               0   5      8"},{"label":"Q2 2025","text":"Executive Summary\n\nI risultati del Q2 2025 sono in continuità con quelli del Q1, ed evidenziano un miglioramento di tutti\ngli indicatori, con un focus positivo soprattutto sul GM2 e sul EBITDA.\n\nRisultati Q2 2025\n   • Ricavi come da piano, con leggera diminuzione rispetto al H2-2024, legata alla riduzione\n        guidata del B2C (-45% vs. YTD24).\n   • GM1, GM2 e Scontrino Medio in netto aumento\n   • Incremento dei volumi B2B (+21% vs. YTD24)\n   • EBITDA in forte recupero (da -39% del H12024 a -14%H12025), grazie ad un attento\n        controllo dei costi, all’incremento dei volumi del B2B ed al miglioramento delle metriche B2C,\n        oggi gestito in ottica di ottimizzazione economica.\n\nNel Q2 sono state portate avanti le azioni iniziate nel Q1 sui temi di razionalizzazione e\nottimizzazione delle attività, con l’obiettivo di ridurre i volumi del B2C ed incrementare quelli B2B.\nOltre alle attività running, il Q2 è stato caratterizzato dall’integrazione commerciale e tecnologica\ncon Longo Speciality, & Magazzini Brianza. Questo ha permesso di arrivare a fine Giugno con\nl’offerta corporate natalizia pronta per la pubblicazione (1 mese in anticipo rispetto allo scorso anno).\n\n                                                  KPI\n\n•   Ebidta: chiusura del secondo semestre con un ottimo risultato sul EBITDA che passa dal -35% del\n    Q1 al -14% del Q2, grazie all’incremento del business sul B2B e la riduzione del B2C.\n\n•   Revenues: Impatto sempre più forte del B2B sul fatturato totale, che passa dal 59% nel Q1 al\n    70% nel Q2. Leggera diminuzione delle revenue (in valore assoluto) data dalle azioni di\n    efficientamento fatte sul B2C che hanno comportato una riduzione del volume (-45% rispetto al\n    primo semestre 2024) e dalla volontà di scegliere solamente più business sano anche sul B2B.\n\n•   GM1 e GM2: continua il miglioramento di entrambi gli indicatori. Si evidenzia un forte aumento\n    del GM2 grazie all’incremento del B2B che, come modello di business, utilizza leve di marketing\n    in modo più efficiente\n\n•   Scontrino Medio YTD: lo scontrino medio è uno dei principali parametri di performance del\n    business. L’incremento è rispetto al Q1 è sostanziale, da 99€ a 139€ dato da:\n        o aumento del peso del b2b\n        o aumento dello scontrino b2c con azioni specifiche su offerta\n        o incremento dell’offerta dedicata a grandi eventi b2b (es. Packaging Premiere, Milano\n            Internet Exchange, ecc.)\n\n•   Marketing: continua l’efficientamento dei costi di marketing, con riduzione dal 11% del Q1 al 8%\n    del Q2. Lo spostamento del budget sul b2b ci permette di ridurre i costi, con la possibilità di una\n    resa amplificata, spostando il focus dalla conversione alla lead acquisition.\n\n                                        MKTG/REV - YTD\n\n                                       32%\n\n                                                   14%\n                                                              8%\n\n                                              23    24     25\n\n•   People: la percentuale di impatto dei salaries sulle revenue è diminuita fortemente nel Q2 a valle\n    della scelta di ridurre il core-team (da 15 a 9 risorse), focalizzato sul business B2B.\n\n                                               People\n\nQuesta la fotografia del team al 30/6.\n\n    Sede         Apprendistato           Stage             TD               TI            Totale\nMilano                2                    1                0               1               4\nRoma                  1                    0                0               4               5\n\nTotale   3   1   0   5   9"},{"label":"Q1 2025","text":"Executive Summary\n\nL’inizio del 2025 ha rappresentato per Cosaporto un punto di svolta decisivo, suggellato dalla\nridefinizione della mission aziendale e da un rebranding completo (logo, identità visiva e tone of\nvoice), per riflettere con coerenza il posizionamento intrapreso nel 2024: un brand di gifting e\ncatering di alta gamma per il mondo corporate, che seleziona le eccellenze per celebrare al meglio\nle occasioni speciali delle aziende.\n\nNel 2025, la strategia è chiara: execution disciplinata del piano avviato nel 2024, con obiettivo\nprioritario di EBITDA positivo e sostenibilità economica. La direzione è netta: concentrarsi su ciò che\ngenera valore, rafforzando il modello B2B e consolidando la leadership nel segmento gifting &\ncatering di qualità per il mercato corporate.\n\nRisultati Q1 2025\n   • Ricavi come da piano, con leggera diminuzione rispetto al 2024 per effetto della stagionalità\n        pasquale.\n   • GM1, GM2 e Scontrino Medio in netto aumento\n   • Forte focus sull’acquisizione di nuovi clienti corporate\n   • Netto miglioramento della marginalità con EBITDA in forte recupero, grazie ad un attento\n        controllo dei costi, all’incremento dei volumi del B2B ed al miglioramento delle metriche B2C,\n        oggi gestito in ottica di ottimizzazione economica.\n\nNel Q1 sono state implementate azioni decisive di Razionalizzazione e Ottimizzazione:\n   • Cancellazione di iniziative non core e stop ai test su nuovi modelli non validati.\n   • Riorientamento delle risorse verso il core business clientela corporate.\n   • Razionalizzazione geografica: è stata confermata la dismissione delle operations B2C su\n      Londra, Firenze, Bologna, Forte dei Marmi a partire da fine Maggio 2025 per concentrare\n      investimenti e risorse sulle aree a maggiore ritorno strategico.\n   • In corso dialoghi strutturati con operatori del delivery B2C per valutare operazioni industriali\n      e di valorizzazione dei nostri asset consumer (clienti, partner e tecnologia).\n\nTeam e processi sales: il team sales è stato confermato con l’inserimento di una nuova figura junior\nper supportare le attività operative. Il focus principale è orientato sulle attività di hunting e su quelle\ndi retention dei clienti esistenti con una forte ottimizzazione dei processi e delle fasi di preventivazione\nattraverso l’utilizzo massivo di Hubspot (CRM).\n\nPartnership: a marzo è stata formalizzata una partnership strategica con Longo Speciality, player\ndi riferimento nel settore gifting, & Magazzini Brianza, con tre obiettivi principali:\n    • Elevare il livello di servizio per i clienti corporate.\n    • Ottimizzare la supply chain e i costi di acquisto e logistici.\n    • Implementare il modello di full outsourcing per le operations gifting, rendendolo più scalabile\n         ed efficiente.\nDopo una fase di scouting e analisi dei possibili partner per la gestione logistica del Natale25\nabbiamo identificato e contrattualizzato il rapporto con Longo, che metterà a disposizione la sua\nexpertise per preparare i nostri pacchi e gestire la logistica, sia per i big deal corporate, sia per gli\nordini singoli acquistati dai clienti privati e azienda direttamente sul sito.\n\nOfferta: incremento dell’offerta di Business Delivery (acquisti self service dei clienti – ticket medio\n300€) e Digital Catering (deal di grandi dimensioni – ticket medio 1500€).\n\nProcesso Dropshipping: dopo il test positivo di Natale sul modello dropshipping, abbiamo realizzato\nuna nuova Dashboard per poter ampliare l’utilizzo di questa modalità verso tutti i fornitori chiave.\nL’obiettivo è ampliare l’offerta senza dover avere un magazzino fisico dove stoccare i prodotti. Zero\neffort logistico da parte di Cosaporto e riduzione dei costi e operations legati all’attività di\nmagazzino, compreso il rischio di invenduti. Visto il successo delle attività svolte a Natale24 con questo\nmodello, abbiamo strutturato un processo più adeguato a gestire alti volumi in ottica Natale25.\n\n                                                   KPI\n\n•   Revenues: la diminuzione delle revenue è data dalla stagionalità della Pasqua, che lo scorso anno\n    è caduta nel Q1 (era 31 Marzo 2024), mentre quest’anno sarà nel Q2. Stiamo infatti registrando\n    un dato di revenue su Aprile più elevato del 2024. Inoltre le azioni di efficientamento fatte sul\n    B2C hanno comportato una riduzione del fatturato, anche dovuto al fatto che in questo primo\n    trimestre ci sono molte feste consumer (S.Valentino, Carnevale, Donna, Papà).\n\n•   GM1 e GM2: in netto aumento per effetto combinato dell’incremento del volume b2b e per le\n    azioni sul b2c intraprese nel 2024 e portate a regime nel Q1 25\n\n•   Scontrino Medio YTD: lo scontrino medio è uno dei principali parametri di performance del\n    business. L’incremento è dato da:\n        o aumento del peso del b2b\n        o aumento dello scontrino b2c con azioni specifiche su offerta\n        o incremento dell’offerta dedicata a grandi eventi b2b e gestione ottimizzata attraverso\n            l’utilizzo del team Account. Esempi Big Deal: Mix, Packaging Premiere, Netcomm Forum\n\n•   Marketing: grazie all’expertise di questi anni sul digital marketing google e meta, siamo riusciti\n    ad ottenere ottime strategie a costi sostenibili. Lo spostamento del budget sul b2b ci permette di\n    ridurre i costi, con la possibilità di una resa amplificata, spostando il focus dalla conversione alla\n\n    lead acquisition. A differenza del b2c, il costo di acquisizione è una tantum ed è subito ripagato\n    dal primo ordine grazie all’alto scontrino del b2b.\n\n•   Ricavi e costi di consegna: il costo di consegna sale leggermente rispetto al 2024 per la maggior\n    presenza di delivery b2b (il cui livello di complessità è maggiore), ma incide meno del 2024\n    grazie allo scontrino medio più elevato. Inoltre questo aumento è parzialmente assorbito\n    dall’aumento dei ricavi da consegna: il cliente b2b è disponibile a pagare di più la consegna ed\n    i servizi annessi.\n\n•   People: la percentuale di impatto dei salaries sulle revenue è sostanzialmente costante, a causa\n    della diminuzione delle revenue, ma il valore assoluto dei salaries, e di tutti gli altri costi fissi, è in\n    netto calo nel Q1 con previsione di ulteriore riduzione nel Q2\n\n                                              People\n\nQuesta la fotografia del team al 31/3.\n\n    Sede        Apprendistato            Stage          TD   TI   Totale\nMilano               2                     2             0   3       7\nRoma                 1                     1             0   6       8\nTotale               3                     3             0   9      15"},{"label":"Q4 2024","text":"Executive Summary\n\nIl quarto trimestre ha portato a Cosaporto ottimi risultati validando la strategia messa in atto durante\nil 2024 focalizzata sul segmento B2B e sulla sostenibilità economica.\n\nI numeri, non ufficiali fino alla chiusura del bilancio: l’anno si chiude con circa 2,5M€ di ricavi (+25%\nrispetto al 2023) e un Ebitda che seppur ancora negativo migliora di oltre il 50% rispetto allo scorso\nanno, dunque un aumento significativo dei ricavi e una direzione decisa verso la sostenibilità\neconomica.\n\nNegli ultimi 2/3 anni sono cambiati decisamente sia gli scenari del mercato in cui operiamo e i relativi\ncomportamenti dei consumatori sia il mercato dei capitali e degli investimenti.\nCosaporto ha operato in un settore caratterizzato da fortissimi cambiamenti, in cui purtroppo\ntantissime aziende (anche grandi) hanno dovuto chiudere o abbandonare il mercato, cercando sempre\ndi mantenere la linea strategica e cercando nuove opportunità di crescita facendo leva sulle forti\ncompetenze sviluppate in questi anni e su un team sempre più solido, mix di risorse senior e giovanissimi\nin grado di integrarsi velocemente grazie ai nostri processi, alla nostra tecnologia e ad una cultura\naziendale molto radicata.\n\nIl percorso iniziato nel 2024 continuerà anche quest’anno: il 2025 sarà un anno di pura execution\ndella strategia con l’obiettivo di raggiungere il più velocemente possibile un Ebitda positivo e la\nsostenibilità economica del modello; quindi: meno investimenti in progetti, meno test di nuove soluzioni\nma focus deciso sui modelli che abbiamo validato.\n\nL’evidenza di quest’ultimo anno è che Cosaporto, grazie al suo posizionamento e tutti gli asset e le\ncapabilities, (tecnologiche, di marketing, di processo) sviluppate in questi 7 anni ha tutte le potenzialità\nper crescere nel mercato B2B. Il B2C continuerà ma anche con un approccio puramente orientato alla\nmarginalità: ogni ordine deve portare il suo margine. Meno ordini ma tutti profittevoli. Scontrino più\nalto, zero sconti, introduzione di service fee e markup, prezzo della consegna correlato al costo interno.\nInoltre, sempre di più il B2C rappresenterà un canale di acquisizione lead per il B2B.\n\nParallelamente abbiamo intavolato discussioni frequenti con soggetti industriali che operano in questo\nmercato da molti anni (catering e gifting) sia per trovare possibili sinergie commerciali e operative\nsia per comprendere al meglio le dinamiche di un mercato composto ancora da piccole realtà poco\nstrutturate abbastanza indietro al livello di tecnologia, digitalizzazione e offerta innovativa verso il\ncliente, a conferma delle opportunità di crescita per una realtà come la nostra.\n\nIn quest’ottica abbiamo deciso di tagliare linee di business e geografie non funzionali alla strategia,\nin particolare stiamo valutando se interrompere le operations b2c a Londra, Firenze e Bologna (queste\nultime due già date in gestione a zero costi) perchè i volumi che hanno generato fin qui non giustificano\nl’effort dedicato.\n\nCome ogni anno stiamo organizzando un incontro in cui potremo entrare nel dettaglio della strategia\ne condividere con tutti i soci spunti e riflessioni e i progetti di sviluppo; la data vi sarà comunicata\nprossimamente.\n\n                                                    KPI\n\n•   Linee di business: la percentuale di giro d’affari connesso alla clientela business è in aumento\n    (68% vs 47% del 2023).\n\n•   Scontrino Medio: lo scontrino medio è uno dei principali parametri di performance del business.\n    Nel 24 aumenta quasi del 40%\n\n•   Marketing: aver focalizzato il business sul B2B ha consentito l’ottimizzazione dei costi di marketing.\n    Complessivamente la spesa è stata circa il 60% più bassa del 2023 con rilevanti efficienze sul\n\n    costo di acquisizione di un nuovo cliente e sul costo sostenuto per ciascun ordine. Queste azioni\n    sono state intraprese da settembre in poi, dunque avranno effetto ancora maggiore nel 2025.\n\n•   Fee Medie: la costante attività di negoziazione con i brand partner ha portato un aumento della\n    fee media dal 22,3% del 23 al 24,2%.\n\n•   Life Time Value: l’importo speso mediamente da un cliente su Cosaporto in 3 anni continua ad\n    aumentare, particolarmente significativa la performance dei clienti business che, complice\n    l’aumento dello spettro di servizi offerto, supera i 2.300€ nel periodo analizzato.\n\n•   Sconti: l’ammontare di sconti e consegne gratuite sono diminuiti di circa il 50%.\n\n•   Ricavi e costi di consegna: abbiamo sviluppato un modello di pricing dinamico per il prezzo di\n    consegna che consente un aumento del ricavo medio senza impatti significativi sul tasso di\n    conversione. Parallelamente l’attività continua di fine tuning delle logiche di assegnazione e\n    negoziazione con i fornitori ha portato una diminuzione significativa del costo medio di consegna.\n    L’azione combinata di queste due azioni ha assottigliato sensibilmente il gap prezzo-costo.\n\n•   People: anche sul team è stato fatto un notevole lavoro di efficienza riducendo limpatto del costo\n    dal 55% al 36% dei ricavi.\n\n•   Gross Margin: Il confronto tra i margini di contribuzione del 2023 e del 2024 evidenzia in maniera\n    chiara gli effetti delle azioni volte a rendere tutti gli ordini sostenibili al livello di primo margine.\n    In questo pesano in particolare:\n        o Aumento prezzo e razionalizzazione costo consegna\n        o Introduzione Service Fee: quota fissa che il cliente paga ad ogni ordine, introdotta ad\n            ottobre\n        o Introduzione mark up sui prodotti: aumento di prezzo interamente fatturato da\n            Cosaporto, introdotto a febbraio\n    Queste azioni, introdotte in corso d’anno, avranno effetti ancor più sensibili nel 2025.\n\n                                                 Highlights\n\n•   Spending review: nel corso del 2024 è stata portata avanti un’attenta analisi e revisione di tutti\n    i costi; l’effetto di questa azione contribuirà a raggiungere l’obiettivo di Ebitda positivo nel 2025.\n\n•   Team e Processi sales: il team sales ha dimostrato di essere solido e performante e i processi di\n    gestione delle richieste dei clienti B2B, rivisti e affinati nello scorso quarter, si sono rivelati snelli e\n    affidabili consentendo una gestione efficace della pipeline anche per risorse giovani. In questo è\n    stato decisivo l’utilizzo degli asset sviluppati nei mesi scorsi sia sul CRM che sulle altre piattaforme.\n\n•   Business Delivery e Digital Catering: tutta l’offerta catering è stata divisa in due linee:\n       o Business Delivery, soluzioni progettate insieme ai nostri partner per gli uffici che il cliente\n           può ordinare in autonomia del sito\n       o Digital Catering, una serie di proposte di catering diverse per esigenza e budget che\n           danno immediatamente all’utente idea di alcune soluzioni possibili in modo da arrivare al\n\n            colloquio con l’account con un’idea già abbastanza precisa da affinare con le opportune\n            personalizzazioni.\n    I clienti stanno dimostrando di riconoscere e apprezzare queste soluzioni che rendono\n    immediatamente l’idea di un’offerta unica e distintiva sul mercato.\n\n•   Processo Dropshipping: nel periodo natalizio abbiamo testato un modello di dropshipping\n    vendendo box regalo confezionate e spedite da alcuni partner quali ad esempio T’A Milano,\n    Incantalia e Longo. È un modello molto interessante perché prevede zero effort logistico da parte\n    di Cosaporto e sgrava di costi e operations legati ad attività di magazzino, compreso il rischio di\n    invenduti. Visto il successo delle attività svolte nei prossimi mesi struttureremo un processo più\n    adeguato a gestire alti volumi da poterla utilizzare in maniera sistematica il prossimo Natale.\n\n•   Collaborazioni con big player\n       o Glovo e Just Eat: i progetti con i due più grandi player di delivery non sono stati\n           particolarmente significativi da un punto di vista di numerosità ma sono stati ottimi veicoli\n           per entrare in contatto con queste realtà e confermare la loro stima e apprezzamento nei\n           confronti di Cosaporto. Entrambi i brand desiderano continuare a collaborare; per il\n           momento il focus è sulla logistica: è già attiva la sinergia con Glovo che esegue parte delle\n           nostre consegne; Just Eat ci ha proposto un’attività analoga che stiamo valutando.\n           Parallelamente teniamo vivi i discorsi per una potenziale partnership industriale non\n           appena le esigenze e le strategie saranno pienamente compatibili\n       o T’A Milano/Incantalia-Polo del Gusto/Longo: la sinergia commerciale con questi partner\n           ci ha dato la possibilità di usufruire di prodotti e risorse logistiche in modalità dropshipping\n           nel periodo natalizio. Anche con questi soggetti, specialmente con Longo e T’A Milano,\n           proseguono le discussioni per ampliare gli ambiti di collaborazione. Si tratta di due realtà\n           consolidate che possono essere un acceleratore per Cosaporto grazie all’ampio catalogo\n           e alla capacità logistica; Cosaporto, d’altro canto, ha un know how di processi e tecnologia\n           che consentirebbe a T’A Milano e Longo di efficientare molto le attività. Tutte le parti al\n           tavolo sono consapevoli dei rispettivi punti di forza e delle opportunità di sinergia; nei\n           prossimi mesi capiremo se le esigenze delle diverse aziende possono convergere.\n\n•   Monetizing-Satispay: nei mesi di novembre e dicembre abbiamo portato avanti una bella\n    iniziativa di Monetizing con Satispay che ha acquistato spazio sul sito e nelle newsletter ed ha\n    voluto essere presente sulle nostre shop con l’obiettivo di conquistare parte dei nostri clienti.\n    L’operazione, analoga a quella condotta lo scorso anno con American Express, dimostra ancora\n    una volta quanto il posizionamento conquistato in questi anni sia percepito come un asset di valore\n    anche da grandi brand operanti in altri settori.\n\n                                                 People\n\nQuesta la fotografia del team al 31/12.\n\n    Sede          Apprendistato            Stage              TD                TI            Totale\nMilano                 3                     0                 0                2                5\nRoma                   1                     1                 0                6                8\nTotale                 4                     1                 0                8               13"},{"label":"Q3 2024","text":"Executive Summary\n\nIl focus del terzo quarter è stata la preparazione agli ultimi 3 mesi dell’anno, decisivi per il\nraggiungimento degli obiettivi. Sono stati disegnati o rivisti tutti i processi di ingaggio e retention per\nla clientela corporate e riviste tutte le iniziative di marketing per attrarre nuovi clienti.\n\nParallelamente è continuato il lavoro iniziato oltre un anno fa di ottimizzazione della marginalità che\nsta portando un miglioramento sensibile dei parametri di sostenibilità finanziaria ed economica (da\nottobre anche una service fee, come spiegato più avanti) senza significativi impatti sui volumi, a\nconferma del valore riconosciuto all’offerta e al servizio.\n\nCome dettagliato di seguito, tutti i KPI sono in linea con il forecast, naturalmente per la stagionalità\ndel nostro business sarà cruciale l’ultimo trimestre dell’anno.\n\nUltimo punto: da qualche mese stiamo approcciando una serie di big player del mercato nell’ottica di\ntrovare partner industriali che possano supportare lo sviluppo del business. I colloqui sono in corso,\nstanno nascendo opportunità di collaborazione, magari tattiche ma fondamentali per conoscersi capire\nse ci sono i presupposti per una sinergia di più lungo periodo. In generale riscontriamo sempre interesse\ne ammirazione per il lavoro svolto e l’approccio strutturato e sistematico; al di là dei numeri del\nbusiness questo contribuisce a rendere la discussione positiva e costruttiva.\n\n                                                   KPI\n\n•   Linee di business: la percentuale di giro d’affari connesso alla clientela business è in aumento\n    (54% vs 42% del 2023). Il trend è in linea agli obiettivi di crescita.\n\n•   Scontrino Medio: lo scontrino medio è uno dei principali parametri di performance del business.\n    Nel Q3 24 aumenta sia lo scontrino del B2C che quello del B2B, in linea con le previsioni di crescita.\n\n•   Fee Medie: la costante attività di negoziazione con i brand partner ha portato un aumento della\n    fee media dal 22,5% del Q3 23 al 26,4%, di fatto già in linea con l’obiettivo annuale 2024\n    (24,2%).\n\n•   Retention: le attività di retention comportano un aumento degli ordini medi dei clienti in 12 mesi\n    che passano da 1,4 a 1,8, in linea con l’obiettivo 2024.\n\n•   Life Time Value: l’importo speso mediamente da un cliente su Cosaporto in 3 anni continua ad\n    aumentare, particolarmente significativa la performance dei clienti business che, complice\n    l’aumento dello spettro di servizi offerto, supera i 2.300€ nel periodo analizzato.\n\n•   Sconti: l’ammontare di sconti e consegne gratuite sono diminuiti portandosi al livello dell’obiettivo\n    annuale.\n\n•   Ricavi e costi di consegna: abbiamo sviluppato un modello di pricing dinamico per il prezzo di\n    consegna che consente un aumento del ricavo medio senza impatti significativi sul tasso di\n    conversione. Parallelamente l’attività continua di fine tuning delle logiche di assegnazione e\n\n    negoziazione con i fornitori ha portato una diminuzione significativa del costo medio di consegna.\n    L’azione combinata di queste due azioni ha assottigliato sensibilmente il gap prezzo-costo.\n\n•   Gross Margin: le azioni su esposte hanno migliorato sensibilmente la marginalità media del singolo\n    ordine, come si evince confrontando i waterfall dei periodi gennaio-settembre 2024 vs 2023.\n    Analizzando il margine di contribuzione di ciascun ordine appare evidente il risultato delle azioni\n    volte alla sostenibilità: gli ordini con un margine di contribuzione negativo sono sensibilmente\n    diminuiti (dal 22% al 7%) a fronte di un aumento dal 3% al 18% degli ordini con margine\n    superiore al 20%.\n\n•   Fatturato: il fatturato aumenta del 38% nel periodo gennaio-settembre, a fronte di un obiettivo\n    annuale di aumento del +40%.\n\n                                                Highlights\n\n•   Cosaporto4Business: dopo aver rinnovato la suite di soluzioni tecnologiche dedicate alle aziende,\n    il focus di questo trimestre è stato ridisegnare tutti i processi di ingaggio e retention dedicati ai\n    clienti corporate. Utilizzando il CRM sono stati messi in piedi processi e pipeline di gestione\n    specifiche per target di clientela e tipologia di richiesta, nell’ottica di semplificare e velocizzare\n    le attività del team di account. Inoltre sono stati realizzati una serie di punti di accesso, ideali per\n    chi naviga sul sito e chi atterra da campagna marketing, utili per avere subito chiaro il tipo di\n    servizio svolto e indirizzare la propria richiesta velocemente. Ad esempio: sono stati realizzati\n    form dedicati alla richiesta di un preventivo per un catering o per la regalistica aziendale\n    all’interno di pagine funzionali a far percepire da subito il valore del servizio e la profondità\n    dell’offerta. Questi asset, insieme con tutti i processi sottesi, si stanno rivelando determinanti nella\n    gestione tempestiva ed efficace delle richieste.\n•   Introduzione service fee: a partire dal mese di ottobre è stata introdotta una service fee, un\n    importo che il cliente paga a Cosaporto per la fruizione del servizio e della piattaforma. La\n    Service Fee è utilizzata da tutte le principali piattaforme e, sebbene sia una quota quasi irrilevante\n    per l’utente (attualmente tra 1 e 2€), in realtà pesa sul bilancio dell’ordine quanto un aumento tra\n    4€ e 8€ dello scontrino medio (in considerazione del fatto che il margine medio riconosciuto a\n    Cosaporto su un acquisto è circa il 25%). Naturalmente questo importo, analogamente al mark up,\n    si riflette in toto, nel margine. Al momento è stata introdotta come importo flat, in futuro valuteremo\n    se renderla dinamica.\n•   Cosaporto Regala Emozioni: la linea Consumer, forte dell’esperienza di questi anni, è pronta al\n    periodo più intenso dell’anno, con un’offerta come sempre di primissimo livello e forte delle\n    innovazioni tecnologiche, tra cui App e MeMo, che migliorano l’esperienza utente. Nonostante le\n    tante azioni volte a perseguire la sostenibilità economica (diminuzione di sconti e consegne gratis,\n    introduzione mark up e service fee, aumento minimo d’ordine) non abbiamo riscontrato significativi\n    cali di ordini a dimostrazione di quanto sia riconosciuto dai clienti il valore dell’offerta e del\n    servizio. Cosaporto continua ad attrarre brand di assoluto livello: tra gli ultimi ingressi citiamo\n    Knam, Palazzo Cordusio, Sant Ambroeus.\n•   Collaborazioni con big player\n          o Glovo: la collaborazione con Glovo, avviata a giugno con la vendita di alcuni prodotti di\n              pasticceria, proseguirà a dicembre con una selezione di panettoni, nostro prodotto di punta\n              per le festività. La collaborazione si estenderà anche alla parte logistica; affideremo alla\n              rete logistica di Glovo parte delle consegne destinate al mercato consumer; questa\n              iniziativa ci consentirà di abbassare i costi di consegna garantendo ai clienti un servizio\n              monitorato e tracciato real time.\n          o Just Eat: parallelamente proseguono i dialoghi con Just Eat; la prima operazione\n              commerciale sarà la vendita di panettoni sulla loro piattaforma; questa iniziativa è volta\n              a incrementare il fatturato e a testare l’interesse della Customer Base di JE in uno dei nostri\n              principali prodotti\n          o Incantalia/Polo del Gusto: Abbiamo tenuto due incontri con Riccardo Illy e il suo staff per\n              valutare possibili sinergie con Incantalia, la nuova iniziativa imprenditoriale che raccoglie\n              tanti grandi brand del mondo del food di altissima qualità e che ha l’obiettivo di aprire\n              decine di negozi in tutta Italia. La prima iniziativa, tattica, sarà quella di vendere su\n              Cosaporto un sottoinsieme dei prodotti Incantalia; nel contempo stiamo valutando diverse\n              opportunità di collaborazione più strutturate che possano far leva sulla tecnologia\n              sviluppata da Cosaporto in questi anni. Il dialogo evolve in maniera costruttiva e il team\n\n         di Incantalia ha dimostrato di apprezzare molto il lavoro svolto da Cosaporto in questi\n         anni.\n       o Longo: Longo è leader sul mercato italiano del Corporate Gifting; i primi incontri hanno\n         fatto subito emergere sintonia e unità di intenti e ammirazione da parte di Longo per\n         quanto realizzato da Cosaporto fino a oggi. Anche con Longo sono allo studio una serie di\n         iniziative tattiche e strategiche che saranno dettagliate nei prossimi mesi.\n\n                                             People\n\nQuesta la fotografia del team al 30/09.\n\n    Sede        Apprendistato          Stage            TD               TI           Totale\nMilano               3                   0               0               2               5\nRoma                 1                   1               0               6               8\nTotale               4                   1               0               8              13"},{"label":"Q1 2024","text":"Executive Summary\n\nNel primo trimestre del 2024, in continuità con gli ultimi mesi del 2023, il focus di Cosaporto è stato\nsulla sostenibilità economica.\nPer perseguire questo obiettivo abbiamo agito su tutte le leve a disposizione:\n    • Aumento del ventaglio di offerta per la clientela business, a maggior valore e margine\n    • Fine tuning costante di tutti i parametri di sostenibilità (Fee %, scontrino medio, Prezzo di\n        consegna, ordine minimo) nell’ottica di aumentare sensibilmente il primo margine di ciascun\n        ordine\n    • Razionalizzazione dei costi fissi e variabili per migliorare la performance economica\n\nLe iniziative intraprese, dettagliate nelle prossime pagine, hanno consentito di raggiungere risultati\neconomici in linea con gli obiettivi.\n\n                                                   KPI\n\n•   Linee di business: la percentuale di giro d’affari connesso alla clientela business è in aumento\n    (32% vs 22% del Q1 2023). Il trend è in linea agli obiettivi di crescita.\n\n•   Scontrino Medio: lo scontrino medio è uno dei principali parametri di performance del business.\n    Nel Q1 24 aumenta sia lo scontrino del B2C che quello del B2B, in linea con le previsioni di crescita.\n\n•   Fee Medie: la costante attività di negoziazione con i brand partner ha portato un aumento della\n    fee media dal 22,5% del Q1 23 al 26,4%, di fatto già in linea con l’obiettivo annuale 2024\n    (24,2%).\n\n•   Retention: le attività di retention comportano un aumento degli ordini medi dei clienti in 12 mesi\n    che passano da 1,4 a 1,7, in linea con l’obiettivo 2024.\n\n•   Sconti: l’ammontare di sconti e consegne gratuite sono diminuiti portandosi al livello dell’obiettivo\n    annuale.\n\n•   Ricavi e costi di consegna: abbiamo sviluppato un modello di pricing dinamico per il prezzo di\n    consegna che consente un aumento del ricavo medio senza impatti significativi sul tasso di\n    conversione. Parallelamente l’attività continua di fine tuning delle logiche di assegnazione e\n    negoziazione con i fornitori ha portato una diminuzione significativa del costo medio di consegna.\n    L’azione combinata di queste due azioni ha assottigliato sensibilmente il gap prezzo-costo.\n\n•   Gross Margin: le azioni su esposte migliorano la sostenibilità delle attività transazionali. Il primo\n    margine passa dal 27% del Q1 23 al 40% del Q1 24. Gli ordini con margine negativo scendono\n    dal 28% all’11% e quelli con margine superiore al 30% passano dal 24% al 42%.\n\n•   Fatturato: il fatturato aumenta del 54% nel primo trimestre, a fronte di un obiettivo annuale di\n    aumento del +39%.\n\n                                               Highlights\n\n•   Sito Cosaporto4Business: Live la pagina dedicata ai servizi per le aziende. È il primo passo verso\n    la realizzazione di un sito dedicato al segmento business che servirà a presentare in maniera più\n    efficace i nuovi servizi e raccogliere lead.\n•   Suite tecnologica: in fase di progettazione nuovi prodotti tecnologici pensati per le aziende che\n    daranno la possibilità di gestire in maniera semplice la regalistica. Questo tipo di iniziative si\n    pongono l’obiettivo di fidelizzare il cliente e creare una baseline ricorrente di ricavi. I prodotti\n    saranno presentati nel corso del Q2.\n•   Start up B2B confederation: una delle principali difficoltà nello sviluppo del segmento B2B è\n    l’acquisizione di nuove lead: interlocutori di aziende e studi professionali a cui presentare i nostri\n    servizi. Considerando che è un problema che accomuna molte realtà che operano in diversi ambiti,\n    abbiamo dato vita a una “start up confederation”: una serie di start up che offrono servizi\n    complementari rivolgendosi ad uno stesso interlocutore con l’obiettivo di scambiarsi lead e\n    opportunità. Questa attività consentirà di raggiungere più facilmente i clienti già nel portafoglio\n    di una delle start up coinvolte. Il progetto si affianca ad altre iniziative in ambito lead generation\n    che coprono anche attività più canoniche quali outbound calls, Google ads, referral, ecc.\n•   Aumento marginalità: tra le principali azioni volte ad incrementare la marginalità di ciascun\n    ordine citiamo:\n        o Rinegoziazione fee: nei mesi scorsi tutte le fee con i brand sono state aumentate in media\n             dell’1,5%. Tutti i brand hanno riconosciuto il valore del servizio accettando di buon grado\n             di rinunciare a parte del loro margine. Questa azione ha un impatto diretto sul conto\n             economico del singolo ordine.\n        o Mark up: in aggiunta alla fee % riconosciuta dal negozio partner è stato introdotto un\n             mark up che aumenta il prezzo del prodotto ed è interamente riconosciuto a Cosaporto.\n             La ragione di questa scelta parte dall’analisi del comportamento degli utenti che hanno\n             dimostrato essere indifferenti ad un aumento di prezzo del singolo prodotto nell’ordine del\n             5-10%, molto sensibili invece ad un eventuale aumento dei costi di consegna. Nel primo\n             mese dell’iniziativa abbiamo fatturato circa 0,5€ per ordine in più. Obiettivo è arrivare\n             almeno a 1€/ordine entro giugno.\n•   Eventi:\n        o Netcomm: Cosaporto sarà food partner di Netcomm Forum, l’appuntamento di riferimento\n             per il mondo digital in Italia. Cosaporto sarà fornitore esclusivo per gli oltre 200 exibitors\n             presenti e avrà uno stand dedicato dove presentare la propria offerta a tutti i visitatori.\n             Sarà un’ottima occasione di visibilità, oltre che di business.\n        o Packaging Premiere: per il terzo anno consecutivo Cosaporto avrà in carico tutto l’aspetto\n             food di Packaging premiere, la più importante fiera di packaging dedicata al mondo del\n             lusso e del beauty che si terrà a Milano a fine Maggio.\n•   Monetizing: prosegue l’attività di monetizing attraverso la vendita di spazi sul sito, newsletter,\n    marketing out of home e altre iniziative. Con i brand più grandi con cui collaboriamo da anni,\n    come Moet Hennessy Italia, Domori, Città del Sole, Panino Giusto, sono state definite a inizio anno\n    una serie di attività di marketing che coprono tutto il 2024.\n•   Modello Join Venture: Il modello join venture, che vede l’ingresso di un imprenditore locale per\n    lo sviluppo commerciale e la gestione operativa della città è stato esteso anche a Forte dei Marmi,\n    con lo stesso imprenditore che ha in gestione Firenze e Bologna. Questa soluzione consente di\n    semplificare la gestione operativa, favorire la crescita dei volumi nelle città piccole e soprattutto\n    di azzerare il rischio che ricade su Cosaporto.\n\n                                          People\n\nQuesta la fotografia del team al 31/03.\n\n    Sede        Apprendistato         Stage        TD   TI   Totale\nMilano               3                  1           0   3       7\nRoma                 1                  1           1   6       9\nTotale               4                  2           1   9      16"},{"label":"Q4 2023","text":"Executive Summary\n\nIl 2023 è stato un anno particolarmente negativo per il comparto delivery; in Italia abbiamo osservato\nil ridimensionamento o la chiusura di tante realtà in crescita e la scelta di player internazionali di\nabbandonare le geografie dove non riuscivano a raggiungere i parametri di sostenibilità. In questo\ncontesto che ha portato a circa il 40% di contrazione di mercato, Cosaporto ha lavorato per\nalimentare linee di ricavo alternative al segmento consumer e rendere il business più sostenibile nel\nlungo periodo focalizzandosi molto anche sugli elementi di bottom line.\n\nDi fatto l’anno può essere diviso in 2 parti che hanno avuto un andamento molto diverso: durante il\nprimo semestre, subito dopo l’aumento di capitale, sono stati avviate attività e investimenti volti alla\ncrescita; a metà anno, stante la contingenza economica, il piano strategico è stato rivisto per\nfocalizzare le azioni sulla sostenibilità, con azioni che, consapevolmente, avrebbero portato anche un\ncalo di volumi nel segmento consumer.\n\nQueste scelte, dettagliate nel seguito del documento, hanno portato a chiudere il 2023 con un\naumento dei ricavi del 30%.\n\n                                             Highlights\n2023:\n   • Crescita: Il dato più importante è la crescita in una contingenza economica negativa che, unita\n      all’andamento dei principali parametri di sostenibilità, rappresenta la base su cui costruire i\n      prossimi anni\n   • B2B: nel corso del 2023 il focus è stato sul segmento aziende, con servizi di regalistica e\n      organizzazione eventi. La quota parte di fatturato legata a questa linea di business è\n      passata dal 40% al 50% del totale, con un aumento in valore assoluto di circa il 60%. È\n      un ambito estremamente positivo per Cosaporto perché garantisce alta retention e alta\n      marginalità.\n   • APP: a metà anno è stata rilasciata la prima app di Cosaporto. Un progetto tecnicamente\n      molto complesso ma cruciale per lo sviluppo futuro. Dai dati emersi nei primi mesi risulta che i\n      clienti che utilizzano l’app hanno un tasso di riordino maggiore di circa il 70% rispetto agli\n      utenti che ordinano unicamente da web. Questo dato, benché rilevato su numeri ancora non\n      particolarmente elevati, sembra confermare la convinzione che l’app sia un fondamentale\n      elemento di retention per il segmento consumer.\n   • Modello Joint Venture: Analizzando i dati di performance è emersa una difficoltà a rendere\n      economicamente sostenibili le città a minor densità abitativa, Bologna e Firenze. Lo squilibrio\n      è dovuto al costo delle attività commerciali e di consegna che non veniva assorbito dai volumi.\n      Abbiamo quindi realizzato un impianto contrattuale con un imprenditore locale che si assume i\n      costi di logistica e sviluppo commerciale a fronte di una quota parte dei ricavi. In questo modo\n      Cosaporto può mantenere la presenza territoriale senza rischiare di sostenere costi\n\n       potenzialmente non remunerati e l’imprenditore può utilizzare risorse e contatti sul territorio\n       per sviluppare il business in modo più veloce ed efficiente, con degli incentivi in funzione del\n       tasso di sviluppo. Cosaporto mantiene l’ownership del marketing, della tecnologia e la\n       possibilità di orientare le scelte operative e commerciali dell’imprenditore, al fine di garantire\n       uniformità con quanto sviluppato nelle altre città.\n   •   Valorizzazione e monetizzazione del posizionamento: da sempre la scelta strategica di\n       Cosaporto in termini di posizionamento è stata netta e definita, anche quando questa decisione\n       ha portato, giocoforza, a rinunciare a volumi e ricavi “facili”. Nel lungo periodo si sta rivelando\n       una scelta vincente. Dal 2023 abbiamo incrementato la monetizzazione del posizionamento\n       con una serie di iniziative di marketing: dalla vendita degli spazi sul sito (banner in home page,\n       prodotti in cima alla lista, spazi nelle newsletter) a iniziative di marketing congiunte con altri\n       brand, anche non presenti come merchant. Un esempio: American Express ha scelto Cosaporto\n       per una campagna marketing di rewarding verso i nuovi clienti proprio perché identifica in\n       Cosaporto un’azienda che si rivolge allo stesso target. Questi servizi ad alto margine nel\n       2023 rappresentano oltre il 10% dei ricavi totali e sono aumentati di circa 4 volte rispetto\n       al 2022.\n   •   Consolidamento asset: Piattaforma, Algoritmi, CRM e BI: la tecnologia è un asset abilitante\n       per il nostro business. Durante l’anno sono state ottimizzate tantissime feature sul sito e tutti i\n       flussi di marketing automation con l’obiettivo di efficientare le performance del team\n   •   Società Benefit: altra caratteristica distintiva di Cosaporto è da sempre l’attenzione al sociale.\n       Abbiamo deciso di diventare una Società Benefit per sottolineare ancor di più quanto i temi\n       di sostenibilità ecologica e sociale siano nostri valori fondanti che si riflettono nelle scelte\n       quotidiane.\n\n2024:\n   • B2B Boost: nel corso del 2024 proseguirà il focus sul segmento aziende. Il team di account\n      dedicato alle attività di hunting e farming crescerà in numero e seniority, realizzeremo nuovi\n      processi di marketing automation dedicati al segmento e sempre più servizi gestiti dagli\n      account saranno disponibili in autonomia sul sito, proseguendo quanto già intrapreso\n      quest’anno\n   • Consolidamento dei Business Model (B2C e B2B): Consumer e Aziende sono due segmenti di\n      clientela da gestire in maniera diversa in termini di offerta, servizi, comunicazioni. Le iniziative\n      che andranno in questa direzione sono:\n           o Creazione di un’area del sito dedicata alle aziende, live a fine gennaio\n           o Differenziazione dell’offerta: per i clienti consumer focus su regalistica e per le aziende\n               eventi, catering e corporate gifting\n           o Realizzazione di automatismi e feature che incrementeranno la possibilità per i clienti\n               azienda di gestire acquisti in autonomia\n   • Consolidamento degli Operating Model (Marketplace e Dark Store): accanto al modello\n      operativo Marketplace, ormai consolidato, stiamo perfezionando il modello di Dark Store con\n      l’introduzione di partner di logistica e processi dedicati. In questo modo possiamo garantirci\n      un maggior margine sui prodotti, flessibilità operativa e ottimizzazione logistica in periodi di\n      alto traffico.\n   • Aumento prezzi vs negozio: da una serie di survey condotte negli anni sulla customer base\n      emerge che la promessa iniziale di mantenere i prezzi dei prodotti analoghi al negozio non è\n      un driver che porta i clienti ad acquistare su Cosaporto, a differenza della selezione e della\n      qualità del servizio. Per questo motivo, in ottica di sostenibilità, dal 2024 valuteremo la\n      possibilità di derogare incrementando il prezzo, come da prassi consolidata per i principali\n      player del settore.\n\n   •   Corporate Gifting Platform: una delle iniziative tecnologiche più apprezzata dalle aziende,\n       semplice quanto efficace. In breve: l’azienda sceglie un set di regali per i propri dipendenti,\n       Cosaporto crea una pagina personalizzata dove ciascun dipendente può accedere, scegliere\n       il regalo preferito e decidere dove e quando riceverlo. Zero complessità da gestire per le\n       aziende, un regalo gradito per il dipendente, nuovi potenziali clienti per Cosaporto.\n       Cavalcando il crescente trend di Corporate Gifting, nel 2024 evolveremo la piattaforma per\n       consentire alle aziende di non utilizzarla solo a Natale ma in tutte le occasioni in cui vuole\n       regalare qualcosa ad un dipendente o ad un cliente.\n   •   Big Brand positioning: Dando continuità alla strategia già in atto nel 2023 proseguiremo le\n       partnership con grandi brand del lusso e del food per arricchire la nostra selezione e\n       consolidare il posizionamento.\n   •   B Corp: dopo essere diventati Società Benefit, nel 2024 intraprenderemo il percorso per\n       diventare B Corp, anche con il supporto di Unicredit che ha selezionato Cosaporto per Unicredit\n       Start Up, un progetto di mentoring e supporto alla crescita dedicato a 70 start up italiane ad\n       alto potenziale.\n   •   Cosaporto Management Team: il team è stato riorganizzato con la scelta di 3 figure\n       manageriali che supporteranno gli executive nel guidare Cosaporto:\n            o Domitilla Marchi, CFO, in Cosaporto da 2 anni\n            o Giorgia Mazzini, Responsabile Cosaporto4Business, in Cosaporto da 1 anno e mezzo\n            o Vittorio Cenci, Business Developement Manager, in Cosaporto da 6 mesi\n\n                                          Revenues Streams\n\nNel 2023 il fatturato legato al segmento business ha raggiunto la metà del totale con un incremento\ndel 60% in valore rispetto all’anno precedente.\nMolto positiva anche la performance dei servizi ad alto valore verso i negozi Partner che raggiungono\nil 15% del totale del fatturato. In questo ambito siamo riusciti a monetizzare il posizionamento\ndistintivo andando a vendere sia servizi come le consegne in white label per i partner sia la visibilità\nsul sito (presenza in home page, prodotti on to nelle liste, ecc) o azioni di comunicazione congiunte di\nco-marketing.\n\nIl segmento consumer subisce una contrazione decisamente inferiore a quella del mercato anche grazie\nad un aumento dello scontrino medio.\n\nLo Scontrino medio, una delle principali metriche di performance, aumenta complessivamente del\n23%, grazie a una serie di azioni:\n    • Crescita del B2B con focus su deal ad alto valore e servizi “non stagionali” (Catering, eventi)\n    • Forte azione di pulizia su negozi partner e prodotti basso scontrino e bassa marginalità\n    • Aumento del minimo d’ordine da 22€ a 25€\n    • Aumento degli ordini fuori città (scontrino medio che supera del 25% circa gli ordini in città)\n       con modello e-commerce\n\nParallelamente sono state attuate una serie di azioni volte ad aumentare la sostenibilità del modello,\nin particolare:\n    • Diminuzione delle consegne gratuite\n    • Aumento del prezzo medio di consegna\n    • Diminuzione degli sconti\n\nQueste azioni sono state portate avanti con l’obiettivo di incrementare la marginalità media, pur nella\nconsapevolezza che avrebbero avuto un impatto importante sul numero di ordini.\n\nDa un punto di vista commerciale sono state ridiscusse la maggior parte delle fee con i negozi partner\n(aumento medio del 2%) e dei prezzi per compravendita/contovendita con i fornitori del Dark Store.\n\nIl risultato combinato di tutte queste scelte è un business più “sano” con il primo margine di contribuzione\ndel singolo ordine consumer che raddoppia e il valore medio che aumenta del 70%.\n\nNel corso del 2024 proseguiranno le azioni volte a incrementare la sostenibilità del business.\n\n                                               People\n\nAnche il lavoro sul team è andato nella stessa direzione. È diminuito il numero di persone rispetto a\ninizio 2023 (-5 FTE), ma con più seniority ed esperienze più funzionali a questa fase di sviluppo.\nQuesta la fotografia del team al 31/12."},{"label":"Q3 2023","text":"Executive Summary\n\nIl 2023 di Cosaporto è nato con il duplice obiettivo di consolidare la crescita, pur in un contesto di\ngenerale contrazione del mercato, e di lavorare alla sostenibilità del modello di business nel lungo\nperiodo. Per perseguire questi obiettivi si è deciso da un lato di equilibrare il segmento consumer che\ngarantisce volumi e brand awareness, dall’altro di incrementare sensibilmente il segmento corporate\nche garantisce margini più elevati. In parallelo il posizionamento unico e distintivo sul mercato,\nconquistato grazie al lavoro di questi anni, abilita sempre di più alla vendita di “servizi a valore\naggiunto”: vendita di spazi pubblicitari su sito/app, attività di marketing mirate, vendita di dati sono\nsolo alcuni esempi di sviluppo di un canale che garantisce margini elevati e contribuisce alla salute\ngenerale del business model perché sempre meno ancorato alle logiche transazionali.\n\nIl risultato di questa politica ha consentito di superare una diminuzione di circa il 20% degli ordini con\nun transato sostanzialmente costante e un fatturato in aumento di circa il 30% rispetto al 2022; lo\nscontrino medio del periodo gennaio-settembre è aumentato di ben il 49% rispetto allo scorso anno\nnonostante il dimezzamento degli sconti (al netto dei coupon elargiti a fronte della campagna di\ncrowdfunding) e l’aumento del 22% del prezzo medio del servizio di consegna.\n\nUna delle chiavi è stato, come su anticipato, proprio il lavoro sul Revenue mix.\nIl segmento consumer non è più predominante ma scende al sotto del 40% del totale fatturato; il\ncorporate raggiunge il 46% e i servizi a valore aggiunto il 15%.\n\n                                          2022                     2023                Delta\nRevenue Mix\n% Consumer                                         58%                      39%           -33%\n% Corporate                                        32%                      46%            43%\n% Other                                            11%                      15%            39%\n\nL’effetto di queste azioni si riflette direttamente sul conto economico di ciascun ordine. Gli ordini con\ngross margin positivo passano dal 44% del periodo gennaio-settembre 2022 al 62% dello stesso\nperiodo 2023; il dato è ovviamente figlio di un lavoro lento ma costante su tutti i parametri di\nredditività volto a rendere il business via via più sostenibile.\n\n                KPI                            2022                        2023                  Delta\nOrdini                                             29.548                      23.062                -22%\nTransato                                      1.424.822 €                 1.349.984 €                 -5%\nFatturato                                       801.578 €                 1.037.982 €                 29%\nFatturato/transato                                     56%                         77%                37%\nScontrino medio                                    58,54 €                     86,98 €                49%\n\n% Sconti                                                1,91%                      0,95%            -50%\nPrezzo medio Consegna                                 5,68 €                     6,95 €              22%\n% Ordini con GM Positivo                                 44%                        62%              41%\n\nDi seguito un approfondimento area per area delle principali iniziative in campo.\n\n                                             Commerciale\nOfferta: le azioni commerciali sono volte ad orientare l’offerta sempre più verso il segmento business,\nche ha dimostrato garantire maggior fidelizzazione, maggiori ricavi e maggiori margini. Per questo\nmotivo stiamo dividendo l’offerta in due linee:\n    • Cosaporto Regala Emozioni, dedicata ai clienti privati e alle loro occasioni speciali\n    • Cosaporto For Business, dedicata alle aziende e focalizzata in eventi e regalistica\nLe due linee sono sinergiche: il consumer garantisce posizionamento e brand awarness ed alimenta il\ncanale corporate, che invece porta ricavi e margine.\n\nQuesta scelta strategica orienta una serie di decisioni, tra cui una netta separazione dell’offerta e la\ncreazione di un’area e servizi dedicati alle aziende.\n\nFranchising: è in corso di sviluppo un modello di franchising che consentirà di estendere le aree di\nservizio attraverso il supporto di imprenditori locali disposti a mettere a disposizione del progetto\nrisorse e competenze. L’impianto contrattuale prevede che Cosaporto prenda una percentuale dei\nricavi delle città oggetto di franchise, senza esserne esposta a sostenere i costi di logistica e sviluppo\ncommerciale; l’imprenditore locale potrà conseguire un premio in caso di raggiungimento degli\nobiettivi di crescita definiti inizialmente. Questa soluzione consente di estendere la presenza\nterritoriale del brand senza rischi per la società e senza distrarre l’attenzione del management e del\nteam dai progetti più strategici. D’altro canto Cosaporto mantiene l’ownership del marketing, della\ntecnologia e la possibilità di orientare le scelte operative e commerciali dell’imprenditore, al fine di\ngarantire uniformità con quanto sviluppato nelle altre città. È già partita una collaborazione con un\nimprenditore che ha preso la gestione di Bologna e Firenze.\n\nSanta Margherita Ligure-Portofino: nel corso del periodo estivo è stata attivata Santa Margherita,\nsulla scia di quanto già fatto a Forte Dei Marmi. Hanno partecipato 15 realtà locali e 10 brand\nmilanesi che, in esclusiva su Cosaporto, hanno potuto offrire ai loro clienti il flash delivery anche in\nLiguria. L’iniziativa si è rivelata un ottimo volano dal punto di vista della comunicazione perché ha\ngarantito visibilità e opportunità di comunicare partnership e contenuti; tuttavia da un punto di vista\ncommerciate non ha portato i risultati sperati e non sarà ripetuta il prossimo anno.\n\nForte dei Marmi: al terzo anno consecutivo a Forte Dei Marmi abbiamo affiancato, al consueto servizio\ndi delivery, un servizio di vendita di spazi e logistica ad un player milanese operante nel mercato del\nvino. Sfruttando la nostra tecnologia e la rete di partner locali il progetto ha portato un risultato\neconomico positivo rivelandosi un esperimento che potrà essere ripetuto su scala maggiore.\n\nOfferta Lifestyle: nell’ottica di un’offerta consumer sempre più focalizzata su gifting sono in corso di\nimplementazione sempre più partnership con brand lifestyle, non food. Alcuni degli accordi chiusi in\nQ3: Etro, 10 Corso Como, Green Pea, Fornasetti, Milano Contract District.\n\nNatale: avvio della strategia per il periodo natalizio\n\n   •   Corporate: sviluppo della pipeline e avvio della proposta di regalistica aziendale\n   •   Operations: redesign dei processi sales e operations in ottica di maggior efficienza e avvio\n       della collaborazione con una società di logistica che prenderà in carico le attività di\n       stoccaggio, boxing e spedizione della regalistica natalizia aziendale\n   •   Londra: sviluppo della strategia Natalizia, con il coinvolgimento di brand italiani che saranno\n       a Londra grazie a Cosaporto e organizzazione ad eventi per far conoscere il brand\n\n                                              Marketing\nGrowth: avvio della partnership con Mirai Bay, società di consulenza a forte trazione data driven,\nche lavorerà con Cosaporto in ambito campagne Social, SEM e Retention con l’obiettivo di aumentare\nla customer base e incrementare il life time value dei clienti.\n\nMonetization: il posizionamento competitivo consolidato negli anni ha reso appetibili spezi\npubblicitari che oggi possono essere venduti con margini alti: banner in home page, primi posti nelle\nricerche prodotti, newsletter o notifiche push dedicate, ma anche campagne Out Of Home in\ncobranding sono alcuni degli esempi di servizi che stiamo offrendo ai brand che consentono di\nmonetizzare la credibilità del brand.\n\nSEO: le attività portate avanti fin da inizio anno stanno portando un aumento del traffico organico.\n\n                                                      IT\nApp: L’app di Cosaporto è andata live nel corso del mese di luglio; già dalla prima release i processi\nprincipali si sono dimostrati solidi e affidabili, nonostante l’elevata complessità tecni
